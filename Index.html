<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Pantry AI — Functional Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF2EC;
  --surface:#FFFFFF;
  --surface-2:#F7F9F4;
  --ink:#15211B;
  --ink-2:#4C574F;
  --ink-3:#828C82;
  --line:#DEE3D8;
  --line-2:#C8CFC2;
  --green:#1C6B47;
  --green-soft:#E4EFE8;
  --amber:#9E6706;
  --amber-soft:#F9F0DA;
  --red:#A32F24;
  --red-soft:#F9E9E6;
  --civic:#2A4780;
  --civic-soft:#E7ECF7;
  --ai:#57457A;
  --ai-soft:#EEE9F5;
  --shadow:0 18px 42px rgba(21,33,27,.16);
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ring:#2A4780;
  --bw:1px;
}
[data-theme="dark"]{
  --paper:#000000; --surface:#0B0B0B; --surface-2:#141414;
  --ink:#F4F4F4; --ink-2:#B4B4B4; --ink-3:#8A8A8A;
  --line:#242424; --line-2:#3A3A3A;
  --green:#5CBE8C; --green-soft:#0D2016;
  --amber:#E2AC55; --amber-soft:#211A0E;
  --red:#EC8574; --red-soft:#241512;
  --civic:#8FADEA; --civic-soft:#111726;
  --ai:#BCA8E2; --ai-soft:#191426;
  --shadow:0 18px 42px rgba(0,0,0,.7);
  --ring:#8FADEA;
}
[data-theme="dark"] body{background-image:none; background:#000}
[data-theme="dark"] .phone{background:#000; box-shadow:0 0 0 1px #2E2E2E, 0 18px 42px rgba(0,0,0,.8)}
[data-theme="dark"] .tabbar,[data-theme="dark"] .phone-screen{background:var(--paper)}
[data-theme="dark"] .box,[data-theme="dark"] .card,[data-theme="dark"] .panel,
[data-theme="dark"] .btn,[data-theme="dark"] input,[data-theme="dark"] select,
[data-theme="dark"] .tour-card,[data-theme="dark"] .sheet-card{background:var(--surface)}
[data-theme="dark"] .intake,[data-theme="dark"] .surface-2{background:var(--surface-2)}
[data-theme="dark"] .island{background:#000}
[data-theme="dark"] .qr-box{background:#fff}
[data-theme="contrast"]{
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
  --ink:#000000; --ink-2:#141414; --ink-3:#2B2B2B;
  --line:#000000; --line-2:#000000;
  --green:#065535; --green-soft:#DFF0E6;
  --amber:#6B4200; --amber-soft:#FBEFD8;
  --red:#93110A; --red-soft:#FBE4E1;
  --civic:#10307F; --civic-soft:#E3E9F8;
  --ai:#3E1F6E; --ai-soft:#EEE7F8;
  --shadow:0 0 0 2px #000;
  --ring:#93110A;
  --bw:2px;
}
[data-theme="contrast"] body{background-image:none; background:#DCDCDC}
[data-theme="contrast"] .box,[data-theme="contrast"] .card,[data-theme="contrast"] .btn,
[data-theme="contrast"] .panel,[data-theme="contrast"] .pill,[data-theme="contrast"] input,
[data-theme="contrast"] select,[data-theme="contrast"] .intake,[data-theme="contrast"] .banner,
[data-theme="contrast"] .chip,[data-theme="contrast"] .stepper{border-width:2px}
[data-theme="contrast"] .flag.muted,[data-theme="contrast"] .muted{color:#2B2B2B}
[data-theme="contrast"] .btn.link,[data-theme="contrast"] .legal a{text-decoration:underline}
[data-theme="contrast"] .tabbar{border-top-width:2px}
[data-theme="contrast"] .tab.on{text-decoration:underline}
[data-theme="dark"] .btn.primary{color:#07120C}
[data-theme="dark"] .btn.civic{color:#080F1C}
[data-theme="dark"] .btn.apple{background:#F2F5F1; color:#0B0F0D; border-color:#F2F5F1}
[data-theme="dark"] .seg button.on,[data-theme="dark"] .roleswitch button.on,[data-theme="dark"] .chip.on{color:#0B120E}
[data-theme="dark"] .meter{background:var(--line-2)}
[data-theme="dark"] .brandmark,[data-theme="dark"] .acct-av,[data-theme="dark"] .avatar{color:#08130D}
[data-theme="contrast"] .btn.primary,[data-theme="contrast"] .btn.civic{color:#fff}
[data-motion="off"] *{animation:none !important; transition:none !important}

/* high-legibility text mode */
[data-text="legible"]{
  --display:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
}
[data-text="legible"] .app-content{letter-spacing:.035em; word-spacing:.12em; line-height:1.75}
[data-text="legible"] .app-content p,[data-text="legible"] .flag,[data-text="legible"] .h-sub{line-height:1.8}
[data-text="legible"] .h-title,[data-text="legible"] .big{letter-spacing:.01em}
[data-text="legible"] .lbl,[data-text="legible"] .pill,[data-text="legible"] .screen-tag{text-transform:none; letter-spacing:.03em}

/* target sizes: 44px for primary controls, never below 24px */
.tab{min-height:50px}
.btn{min-height:44px}
.btn.small{min-height:38px; padding:9px 10px}
.chip{min-height:36px; padding:8px 13px; display:inline-flex; align-items:center}
.stepper button{width:42px; height:44px}
.toggle{width:44px; height:26px}
.toggle i{width:20px; height:20px}
.toggle.on i{left:21px}
.flag-btn{min-height:44px; padding:12px 4px 12px 0}
.seg button{min-height:38px; padding:9px 12px}
.avatar{width:34px; height:34px}
.list-row[data-act]{min-height:48px}

.err-text{color:var(--red); font-size:11px; margin-top:5px; display:flex; align-items:center; gap:5px}
input[aria-invalid="true"]{border-color:var(--red); border-width:2px}
.toast-close{
  background:none; border:0; color:inherit; cursor:pointer; font-size:15px; line-height:1;
  padding:6px 8px; margin:-6px -6px -6px 8px; border-radius:6px;
}
.toastbar{pointer-events:none}
.toastbar.on .banner{pointer-events:auto; display:flex; align-items:flex-start; justify-content:space-between; gap:6px}
.speaking{outline:2px dashed var(--green); outline-offset:3px}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(180deg,#F4F6F1,#EAEEE5);
  background-attachment:fixed;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ring); outline-offset:2px; border-radius:4px}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:12px; top:-48px; background:var(--ink); color:var(--paper);
  padding:9px 13px; border-radius:8px; z-index:60; font-size:12px; transition:top .15s;
}
.skip-link:focus{top:12px}
.a11y-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dotted var(--line)}
.a11y-row:last-child{border-bottom:0}
.seg{display:flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; flex:0 0 auto}
.seg button{border:0; background:var(--surface); color:var(--ink-2); font-size:11px; padding:7px 10px; cursor:pointer; font-family:inherit}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink); color:var(--paper); font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- page frame ---------- */
.topbar{
  max-width:1180px; margin:0 auto; padding:20px 24px 8px;
  display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap;
}
.brand h1{
  font-family:var(--display); font-size:22px; font-weight:800; margin:0; letter-spacing:-.02em;
}
.brand p{margin:3px 0 0; font-size:12px; color:var(--ink-2)}
.tag{
  display:inline-block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  letter-spacing:.1em; background:var(--ink); color:var(--paper); padding:3px 7px; border-radius:3px;
  margin-left:8px; vertical-align:3px;
}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.roleswitch{display:flex; background:var(--surface); border:1px solid var(--line-2); border-radius:8px; padding:3px}
.roleswitch button{
  border:0; background:none; font-size:12px; padding:6px 11px; border-radius:6px; cursor:pointer; color:var(--ink-2);
}
.roleswitch button.on{background:var(--ink); color:#fff}
.ghost{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  font-size:12px; padding:8px 11px; border-radius:8px; cursor:pointer;
}
.ghost:hover{border-color:var(--ink-3)}

.stage{
  max-width:1180px; margin:0 auto; padding:14px 24px 70px;
  display:flex; gap:34px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
}

/* ---------- phone ---------- */
.phone-col{display:flex; flex-direction:column; align-items:center}
.phone{width:392px; max-width:100%; background:#111A15; border-radius:44px; padding:13px; box-shadow:var(--shadow)}
.phone-screen{
  background:var(--surface); border-radius:32px; height:794px; overflow:hidden;
  position:relative; display:flex; flex-direction:column;
}
.statusbar{
  height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; font-size:11px; font-weight:600; position:relative;
}
.sb-right{display:flex; align-items:center; gap:5px; color:var(--ink)}

/* carrier name, left, scrolling the way iOS ticks a long carrier string */
.carrier-wrap{
  width:66px; overflow:hidden; color:var(--ink);
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 5px, #000 calc(100% - 6px), transparent 100%);
          mask-image:linear-gradient(90deg, transparent 0, #000 5px, #000 calc(100% - 6px), transparent 100%);
}
.carrier{
  display:inline-block; white-space:nowrap; font-size:10.5px; font-weight:600; letter-spacing:-.01em;
  animation:carrier-tick 8s ease-in-out infinite;
}
@keyframes carrier-tick{
  0%, 18%   {transform:translateX(0)}
  46%, 64%  {transform:translateX(calc(-100% + 60px))}
  92%, 100% {transform:translateX(0)}
}
@media (prefers-reduced-motion:reduce){ .carrier{animation:none} }

/* dynamic island */
.island{
  position:absolute; left:50%; top:9px; transform:translateX(-50%);
  width:104px; height:29px; border-radius:16px; background:#0B100D;
  display:flex; align-items:center; justify-content:flex-end; padding-right:9px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06);
}
.island .cam{
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle at 34% 32%, #2C3A45 0 45%, #101820 60%, #05080A 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
.ic-sig,.ic-wifi{display:block}
.batt{
  width:24px; height:12px; border:1px solid currentColor; border-radius:3.5px; padding:1.5px;
  position:relative; opacity:.9; margin-left:1px;
}
.batt::after{content:""; position:absolute; right:-3.5px; top:3.5px; width:2px; height:5px; background:currentColor; border-radius:0 2px 2px 0; opacity:.55}
.batt i{display:block; height:100%; background:currentColor; border-radius:1.5px}
.app-content{flex:1; overflow-y:auto; padding:4px 16px 18px; scrollbar-width:none}
.app-content::-webkit-scrollbar{width:0}
.tabbar{
  flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--surface); padding:8px 4px 13px;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3);
  font-size:9px; background:none; border:0; cursor:pointer; padding:2px 1px; letter-spacing:0;
  min-width:0; white-space:nowrap;
}
.tab .ico{display:block}
.tab.on{color:var(--green); font-weight:600}
.tab .pip{width:4px; height:4px; border-radius:50%; background:transparent; margin-top:1px}
.tab.on .pip{background:var(--green)}
.ico{flex:0 0 auto; vertical-align:-4px}
.btn .ico{vertical-align:-4px; margin-right:7px}
.stat-ico{color:var(--ink-3)}
.tab .badge{
  position:absolute; transform:translate(14px,-4px); background:var(--red); color:#fff;
  font-family:var(--mono); font-size:8px; border-radius:7px; padding:0 4px; line-height:13px;
}

/* ---------- content primitives ---------- */
.screen-tag{
  font-family:var(--mono); font-size:9.5px; font-weight:500; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink-2); margin:8px 1px 9px; display:flex; justify-content:space-between; align-items:center;
}
.h-title{font-family:var(--display); font-size:20px; font-weight:700; margin:0 0 2px; letter-spacing:-.02em}
.h-sub{margin-top:0}
.h-sub{font-size:11.5px; color:var(--ink-2); margin:0 0 13px; line-height:1.45}
.box{border:1px solid var(--line); border-radius:11px; background:var(--surface)}
.pad{padding:12px}
.stack>*{margin-bottom:10px}
.stack>*:last-child{margin-bottom:0}
.lbl{
  font-family:var(--mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-2); margin-bottom:5px;
}
.lbl-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.lbl-row .lbl{margin-bottom:5px}
.big{font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.05}
.flag{font-size:10.5px; color:var(--ink-2); line-height:1.45}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}

.btn{
  display:inline-block; border:1px solid var(--line-2); border-radius:9px; padding:11px 12px;
  font-size:12.5px; cursor:pointer; background:var(--surface); color:var(--ink); text-align:center;
  font-weight:500; transition:background .12s,border-color .12s;
}
.btn:hover:not([disabled]){background:var(--surface-2); border-color:var(--ink-3)}
.btn.primary{background:var(--green); color:#fff; border-color:var(--green)}
.btn.primary:hover:not([disabled]){background:#175A3B}
.btn.civic{background:var(--civic); color:#fff; border-color:var(--civic)}
.btn.civic:hover:not([disabled]){background:#233C6C}
.btn.block{display:block; width:100%; margin-bottom:8px}
.btn.small{padding:7px 9px; font-size:11px; border-radius:7px}
.btn.link{border:0; background:none; color:var(--civic); text-decoration:underline; padding:8px 0; font-size:12px}
.btn[disabled]{opacity:.38; cursor:not-allowed}
.row-btns{display:flex; gap:6px}
.row-btns .btn{flex:1}

.pill{
  display:inline-block; font-family:var(--mono); font-size:9.5px; font-weight:500; padding:2.5px 6px; border-radius:4px;
  border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap; text-transform:uppercase; letter-spacing:.04em;
}
.pill.fresh{border-color:var(--green); color:var(--green); background:var(--green-soft)}
.pill.soon{border-color:var(--amber); color:var(--amber); background:var(--amber-soft)}
.pill.expiring{border-color:var(--red); color:var(--red); background:var(--red-soft)}
.pill.civic{border-color:var(--civic); color:var(--civic); background:var(--civic-soft)}
.pill.plain{background:var(--surface-2)}

.list-row{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 2px; border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none}
.list-row .name{font-size:12.5px; font-weight:600}
.list-row .right{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px}

.chip-row{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:3px; scrollbar-width:none}
.chip-row::-webkit-scrollbar{height:0}
.chip{
  font-size:10.5px; padding:6px 11px; border:1px solid var(--line-2); border-radius:14px;
  white-space:nowrap; color:var(--ink-2); background:var(--surface); cursor:pointer;
}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}

.card{border:1px solid var(--line); border-radius:11px; padding:12px; background:var(--surface)}
.card h4{font-family:var(--display); margin:0 0 3px; font-size:14px; font-weight:700; letter-spacing:-.01em}

/* signature: AI provenance */
.ai-block{border-left:2px dashed var(--ai); padding-left:9px}
.ai-chip{
  display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:9px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ai); background:var(--ai-soft);
  border:1px solid var(--ai); border-radius:4px; padding:2px 5px; cursor:help;
}
.ai-chip .dot{width:4px; height:4px; border-radius:50%; background:var(--ai)}
.why{font-size:10.5px; color:var(--ai); margin:4px 0 7px; line-height:1.45}

.field{margin-bottom:10px}
.field label{display:block; font-family:var(--mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); margin-bottom:4px}
input[type=text],input[type=number],select,textarea{
  width:100%; border:1px solid var(--line-2); border-radius:8px; padding:9px 10px;
  font-size:12.5px; font-family:var(--body); background:var(--surface); color:var(--ink);
}
input[type=file]{font-size:11px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.grid3{display:grid; grid-template-columns:1.4fr .8fr .8fr; gap:8px}

.checklist label{display:flex; align-items:flex-start; gap:9px; font-size:12px; margin-bottom:12px; line-height:1.4; cursor:pointer}
.checklist label:last-child{margin-bottom:0}
.checklist input{margin-top:2px; width:16px; height:16px; accent-color:var(--civic); flex:0 0 auto}

.banner{border-radius:9px; padding:10px 11px; font-size:11px; line-height:1.45; border:1px solid}
.banner.ok{background:var(--green-soft); border-color:var(--green); color:var(--green)}
.banner.warn{background:var(--amber-soft); border-color:var(--amber); color:var(--amber)}
.banner.err{background:var(--red-soft); border-color:var(--red); color:var(--red)}
.banner.info{background:var(--civic-soft); border-color:var(--civic); color:var(--civic)}

.meter{height:6px; background:var(--line); border-radius:4px; overflow:hidden}
.meter > i{display:block; height:100%; background:var(--green)}
.meter.warn > i{background:var(--amber)}
.meter.risk > i{background:var(--red)}

.factor{display:flex; justify-content:space-between; gap:8px; font-size:10.5px; padding:5px 0; border-bottom:1px dotted var(--line)}
.factor:last-child{border-bottom:0}
.factor .d{font-family:var(--mono); font-size:10px}
.factor .up{color:var(--red)}
.factor .down{color:var(--green)}

.auth{display:flex; flex-direction:column; min-height:100%; padding:14px 6px 10px}
.brandmark{
  width:58px; height:58px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(150deg,#26855A,#134430); color:#fff; margin-bottom:15px;
  box-shadow:0 10px 24px rgba(19,68,48,.28);
}
.auth h2{font-family:var(--display); font-size:25px; font-weight:800; letter-spacing:-.03em; margin:0 0 5px}
.auth .tag-line{font-size:12.5px; color:var(--ink-2); line-height:1.5; margin:0 0 22px}
.btn.apple{background:#0D0F0E; color:#fff; border-color:#0D0F0E}
.btn.apple:hover:not([disabled]){background:#000}
.btn.sso{display:flex; align-items:center; justify-content:center; gap:9px; padding:12px; font-weight:500}
.divider{display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--ink-3); font-size:10.5px}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line)}
.legal{font-size:10px; color:var(--ink-3); line-height:1.5; text-align:center; margin-top:auto; padding-top:18px}
.legal a{color:var(--ink-2)}
.gmark{font-family:var(--display); font-weight:800; font-size:16px; line-height:1}

.faceid{
  width:112px; height:112px; margin:0 auto; position:relative; border-radius:26px;
  border:2px solid var(--green); color:var(--green);
}
.faceid.scanning .scanline{
  position:absolute; left:8px; right:8px; height:2px; background:var(--green); border-radius:2px;
  box-shadow:0 0 12px rgba(28,107,71,.7); animation:scan 1.5s ease-in-out infinite;
}
@keyframes scan{0%,100%{top:14px}50%{top:92px}}
.faceid .face{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}

.acct-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.acct-av{
  width:52px; height:52px; border-radius:50%; background:linear-gradient(150deg,#26855A,#134430);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--display); font-size:20px; font-weight:700; flex:0 0 auto;
}
.avatar{
  width:27px; height:27px; border-radius:50%; background:linear-gradient(150deg,#26855A,#134430); color:#fff;

<script>
/* =========================================================================
   Smart Pantry AI — functional prototype
   Four implemented layers:
     1. OCR pantry        → a receipt is read into editable pantry rows
     2. Recipe matching   → a recipe library scored against live pantry state
     3. Predictive waste  → on-device scoring model, fully explainable
     4. Donation routing  → rules engine matching items to org acceptance policy
   ========================================================================= */

const DAY = 86400000;
const MODEL = "claude-sonnet-4-6";

const CAT = {
  produce:  {label:"Produce",   shelf:5,   stable:false, portion:2},
  dairy:    {label:"Dairy",     shelf:10,  stable:false, portion:2},
  meat:     {label:"Meat",      shelf:3,   stable:false, portion:1},
  bakery:   {label:"Bakery",    shelf:4,   stable:false, portion:1},
  canned:   {label:"Canned",    shelf:540, stable:true,  portion:1},
  dry:      {label:"Dry goods", shelf:400, stable:true,  portion:1},
  frozen:   {label:"Frozen",    shelf:120, stable:false, portion:2},
  condiment:{label:"Condiment", shelf:200, stable:true,  portion:1},
  other:    {label:"Other",     shelf:20,  stable:false, portion:1}
};

const ORGS = [
  {id:"o1", name:"Third Street Community Pantry", area:"Third & Vine", address:"412 Third St, Suite B",
   lat:40.7205, lng:-74.0021, accepts:["canned","dry","condiment"], hours:[9,18],
   capacity:{used:340,total:500}, needs:["canned protein","rice"], refrigeration:false,
   prefers:"items", ein:"47-0221884"},
  {id:"o2", name:"Riverside Food Bank", area:"Riverside", address:"88 Harbor Way",
   lat:40.7331, lng:-74.0148, accepts:["canned","dry","condiment","frozen"], hours:[8,20],
   capacity:{used:900,total:2000}, needs:["pasta","cooking oil"], refrigeration:true,
   prefers:"funds", ein:"52-1918330"},
  {id:"o3", name:"Grace Kitchen (hot meals)", area:"Midtown south", address:"1200 Grace Ave",
   lat:40.7462, lng:-73.9903, accepts:["canned","dry","produce","condiment"], hours:[7,14],
   capacity:{used:180,total:200}, needs:["fresh produce"], refrigeration:true,
   prefers:"funds", ein:"13-4009872"},
  {id:"o4", name:"Eastside Shelter Pantry", area:"Eastside", address:"55 Ellis Rd",
   lat:40.7098, lng:-73.9776, accepts:["canned","dry"], hours:[10,17],
   capacity:{used:210,total:400}, needs:["canned beans","cereal"], refrigeration:false,
   prefers:"items", ein:"81-3320145"},
  {id:"o5", name:"Harbor Mutual Aid Fridge", area:"Harbor", address:"9 Dock Lane",
   lat:40.7016, lng:-74.0129, accepts:["produce","dairy","bakery","canned"], hours:[0,24],
   capacity:{used:40,total:60}, needs:["bread"], refrigeration:true,
   prefers:"items", ein:"85-2277401"}
];

const HOME = {lat:40.7128, lng:-74.0060};

/* Requests are posted by the organisations, not inferred from anyone's pantry.
   This is the other direction of the exchange: stated need, not surplus. */
function seedRequests(){
  const now = Date.now();
  return [
    {id:"Q-1041", orgId:"o1", item:"Canned chickpeas", category:"canned", unit:"tin", price:1.15,
     qty:120, filled:38, urgency:"urgent", note:"Weekend family bags. We are 80 short for Saturday.", created:now - 2*DAY},
    {id:"Q-1042", orgId:"o1", item:"Cooking oil (1L)", category:"condiment", unit:"bottle", price:4.20,
     qty:40, filled:31, urgency:"soon", note:"Every hot-meal bag needs one. Almost there.", created:now - 5*DAY},
    {id:"Q-1043", orgId:"o4", item:"Breakfast cereal", category:"dry", unit:"box", price:3.40,
     qty:90, filled:12, urgency:"urgent", note:"School holidays start Monday and breakfast demand doubles.", created:now - 1*DAY},
    {id:"Q-1044", orgId:"o2", item:"Dried pasta 500g", category:"dry", unit:"pack", price:1.05,
     qty:200, filled:150, urgency:"ongoing", note:"Our steady staple. Always useful, never urgent.", created:now - 9*DAY},
    {id:"Q-1045", orgId:"o5", item:"Long-life milk", category:"dry", unit:"carton", price:1.30,
     qty:60, filled:9, urgency:"soon", note:"Requested repeatedly by families with young children.", created:now - 3*DAY}
  ];
}
const SHOPS = ["Amazon", "Target", "Walmart", "Instacart", "Kroger", "Another shop"];
const URGENCY = {
  urgent:{label:"Urgent", cls:"expiring"},
  soon:{label:"Needed soon", cls:"soon"},
  ongoing:{label:"Ongoing", cls:"plain"}
};
function openRequests(){ return S.requests.filter(r=>r.filled < r.qty); }
function requestFor(id){ return S.requests.find(r=>r.id === id); }

/* ---------------------------------------------------------------- state */
let S;
function seed(){
  const now = Date.now();
  const mk = (name,qty,unit,cat,daysLeft,extra={}) => Object.assign({
    id:"i"+Math.random().toString(36).slice(2,8), name, qty, unit, category:cat,
    added: now - (extra.age||2)*DAY,
    expiry: now + daysLeft*DAY,
    opened:false, source:"seed", conf:1
  }, extra);
  return {
    role:"household",
    view:"home",
    prefs:{vegetarian:false, quick:false, protein:false, nocook:false},
    pantry:[

const KEY = "smartpantry:v1";
async function save(){
  if(!window.storage) return;
  try{
    const {busy, toast, scan, detail, trace, tour, flag, scanState, help, returnFocus, ...keep} = S;
    await window.storage.set(KEY, JSON.stringify(keep));
  }catch(e){ /* demo continues in memory */ }
}
async function load(){
  if(!window.storage) return false;
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value){ Object.assign(S, JSON.parse(r.value)); return true; }
  }catch(e){}
  return false;
}

/* ------------------------------------------------------------ helpers */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysLeft = it => Math.ceil((it.expiry - Date.now())/DAY);
const ageDays  = it => Math.floor((Date.now() - it.added)/DAY);
const isStable = it => !!(CAT[it.category]||CAT.other).stable;
const round1 = n => Math.round(n*10)/10;

function freshness(it){
  const d = daysLeft(it);
  if(d <= 2) return {cls:"expiring", word:"Expiring"};
  if(d <= 6) return {cls:"soon", word:"Use soon"};
  return {cls:"fresh", word:"Fresh"};
}
function shelfWord(it){
  const d = daysLeft(it);
  if(d < 0) return "expired";
  if(d > 60) return "~" + Math.round(d/30) + " mo";
  return d + (d===1?" day":" days");
}
function distanceMi(a,b){
  const R=3958.8, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return round1(2*R*Math.asin(Math.sqrt(s)));
}
function orgOpen(o){
  const h = new Date().getHours();
  if(o.hours[0]===0 && o.hours[1]===24) return true;
  return h >= o.hours[0] && h < o.hours[1];
}
function hoursLabel(o){
  return (o.hours[0]===0 && o.hours[1]===24) ? "always open" : hourLabel(o.hours[0]) + "\u2013" + hourLabel(o.hours[1]);
}
function hourLabel(h){
  if(h===0||h===24) return "24h";
  const ap = h>=12 ? "pm":"am"; const hh = h%12===0?12:h%12;
  return hh+ap;
}
let toastTimer = null;
function toast(msg, kind){
  S.toast = {msg, kind: kind || "ok"};
  renderToast();
}
function renderToast(){
  const el = $("toastbar"); if(!el) return;
  if(!S.toast){ el.className = "toastbar"; el.innerHTML = ""; return; }
  el.innerHTML = '<div class="banner ' + S.toast.kind + '"><span>' + esc(S.toast.msg) + '</span>' +
    '<button class="toast-close" data-act="toastClose" aria-label="Dismiss this message">\u00d7</button></div>';
  el.className = "toastbar show on";
  clearTimeout(toastTimer);
  /* anyone who has asked for more reading time keeps the message until they dismiss it */
  const needsTime = S.motion === false || (S.textScale || 1) > 1 || S.legible;
  if(!needsTime) toastTimer = setTimeout(()=>{ S.toast = null; renderToast(); }, 4200);
}

/* ---------------------------------------------------- ask parsing */
const ASK_RULES = [
  {re:/\b(no|without|free of)\s*(dairy|milk|cheese|yogurt|curd|cream)\b|dairy[- ]free/i, label:"no dairy", ex:["yogurt","cheese","cheddar","milk","cream","butter","curd","feta","mozzarella","parmesan"]},
  {re:/\b(no|without)\s*(onion|garlic)\b/i, label:"no onion or garlic", ex:["onion","garlic"]},
  {re:/\b(vegetarian|veggie|no meat|meat[- ]free)\b/i, label:"vegetarian", tag:"vegetarian"},
  {re:/\b(one[- ]?pot|one[- ]?pan|single pan)\b/i, label:"one pot", tag:"onepot"},
  {re:/\b(no[- ]?cook|raw|no heat)\b/i, label:"no cooking", tag:"nocook"},
  {re:/\b(quick|fast|under 20|15 min|20 min|weeknight)\b/i, label:"under 20 minutes", max:20},
  {re:/\b(batch|meal prep|leftovers|lunchbox|freezer)\b/i, label:"cooks in batches", tag:"batch"},
  {re:/\b(protein|filling|hearty)\b/i, label:"high protein", tag:"protein"},
  {re:/\b(spicy|hot|chilli|chili)\b/i, label:"spicy", heat:"Hot"},
  {re:/\b(mild|not spicy|kid|child)\b/i, label:"mild", heat:"Mild"}
];
function parseAsk(text){
  const out = {understood:[], ex:[], tags:[], max:null, mustUse:[], heat:null, unread:false};
  const t = String(text||"").trim();
  if(!t) return out;
  ASK_RULES.forEach(r=>{
    if(r.re.test(t)){
      out.understood.push(r.label);
      if(r.ex) out.ex = out.ex.concat(r.ex);
      if(r.tag) out.tags.push(r.tag);
      if(r.max) out.max = r.max;
      if(r.heat) out.heat = r.heat;
    }
  });
  const low = t.toLowerCase();
  S.pantry.forEach(it=>{
    const first = it.name.toLowerCase().split(" ").pop();
    if(low.indexOf(it.name.toLowerCase()) >= 0 || (first.length > 3 && low.indexOf(first) >= 0)){
      if(out.mustUse.indexOf(it.name) < 0){
        out.mustUse.push(it.name);
        out.understood.push("use the " + it.name.toLowerCase());
      }
    }
  });
  out.unread = out.understood.length === 0;
  return out;
}

/* ------------------------------------------------- pantry matching */
function availablePantry(){ return S.pantry.filter(it=>!it.locked && daysLeft(it) >= 0); }
function findInPantry(keys, exclude){
  let best = null, bestUrgency = -1;
  availablePantry().forEach(it=>{
    const n = it.name.toLowerCase();
    if(exclude && exclude.some(x=>n.indexOf(x) >= 0)) return;
    if(!keys.some(k=>n.indexOf(k) >= 0)) return;
    const urgency = 400 - Math.min(400, daysLeft(it));
    if(urgency > bestUrgency){ bestUrgency = urgency; best = it; }
  });
  return best;
}
function cuisineGroupOf(cuisine){
  for(const [g, list] of CUISINE_GROUPS) if(list.indexOf(cuisine) >= 0) return g;
  return null;
}
function scoreEntry(e, ask, people){
  if(S.dismissed.indexOf(e.t) >= 0) return null;
  if(S.prefs.vegetarian && e.tags.indexOf("vegetarian") < 0) return null;
  if(S.prefs.nocook && e.tags.indexOf("nocook") < 0) return null;
  if(S.prefs.protein && e.tags.indexOf("protein") < 0) return null;
  if(S.prefs.quick && e.min > 20) return null;
  if(ask.max && e.min > ask.max) return null;
  if(ask.tags.some(t=>e.tags.indexOf(t) < 0)) return null;
  if(ask.ex.length){
    const text = (e.core.map(c=>c.k.join(" ")).join(" ") + " " + e.staples.join(" ")).toLowerCase();
    if(ask.ex.some(x=>text.indexOf(x) >= 0)) return null;
  }
  const required = e.core.filter(c=>!c.opt);
  const matched = [], missing = [];
  e.core.forEach(c=>{
    const it = findInPantry(c.k, ask.ex);
    if(it && !matched.some(m=>m.item.id === it.id)) matched.push({spec:c, item:it});
    else if(!c.opt) missing.push(c);
  });
  const gotRequired = required.length - missing.length;
  if(!gotRequired) return null;
  if(gotRequired / required.length < 0.6) return null;
  if(ask.mustUse.length && !matched.some(m=>ask.mustUse.indexOf(m.item.name) >= 0)) return null;
  if(S.focus && !matched.some(m=>m.item.name === S.focus)) return null;

  let score = 40 * (gotRequired / required.length);
  matched.forEach(m=>{ score += Math.max(0, 16 - daysLeft(m.item)) * 2.2; });
  score += matched.length * 4;
  score -= missing.length * 9;
  if(S.cuisine && S.cuisine !== "Any"){
    if(e.c === S.cuisine) score += 80;
    else if(cuisineGroupOf(e.c) === cuisineGroupOf(S.cuisine)) score += 25;
  }
  return {entry:e, matched, missing, score:Math.round(score)};
}
function buildRecipe(m, ask, people){
  const e = m.entry;
  const scale = people / 2;
  const urgent = m.matched.slice().sort((a,b)=>daysLeft(a.item) - daysLeft(b.item)).slice(0,2);
  const why = "Uses " + urgent.map(u=>u.item.name.toLowerCase() + " (" + shelfWord(u.item) + ")").join(" + ") +
              (ask.understood.length ? " \u00b7 " + ask.understood.slice(0,2).join(", ") : "");
  const steps = e.steps.slice();
  const heat = (ask.heat || (S.cuisine !== "Any" ? S.heat : null));
  if(heat === "Hot") steps.push("Finish with fresh or dried chilli to taste.");
  if(heat === "Mild") steps.push("Leave out the chilli; a little black pepper is enough.");
  return {
    id:"r" + Math.random().toString(36).slice(2,8),
    title: e.t,
    cuisine: e.c,
    why: why,
    uses: m.matched.map(x=>({name:x.item.name, qty:Math.max(0.5, round1(x.spec.q * scale)), unit:x.spec.u})),
    extras: e.staples.slice(0,3).concat(m.missing.map(c=>c.k[0])).slice(0,4),
    minutes: e.min,
    servings: people,
    tags: [e.c].concat(e.tags.filter(t=>t !== "vegetarian" || true).slice(0,1)),
    steps: steps,
    tip: e.tip,
    matchScore: m.score,
    edited: false
  };
}
function planMeals(){
  const people = S.people || 2, meals = S.meals || 3;
  const ask = parseAsk(S.ask);
  S.askParsed = ask;
  let pool = RDB.map(e=>scoreEntry(e, ask, people)).filter(Boolean).sort((a,b)=>b.score - a.score);
  let note = null;
  if(S.cuisine && S.cuisine !== "Any"){
    const exact = pool.filter(m=>m.entry.c === S.cuisine);
    if(exact.length >= meals) pool = exact;
    else if(exact.length) note = "Only " + exact.length + " " + S.cuisine + " dish" + (exact.length===1?"":"es") +
      " matched your pantry, so the rest come from nearby cuisines.";
    else note = "Nothing " + S.cuisine + " matched what you have, so these are the closest fits from other cuisines.";
  }
  const picked = [], covered = {};
  for(let n = 0; n < meals; n++){
    let best = null, bestVal = -Infinity;
    pool.forEach(m=>{
      if(picked.indexOf(m) >= 0) return;
      let fresh = 0, repeat = 0;
      m.matched.forEach(x=>{
        if(covered[x.item.id]) repeat++;
        else if(daysLeft(x.item) <= 3) fresh++;
      });
      const val = m.score + fresh * 30 - repeat * 20;
      if(val > bestVal){ bestVal = val; best = m; }
    });
    if(!best) break;
    picked.push(best);
    best.matched.forEach(x=>{ covered[x.item.id] = true; });
  }
  S.planNote = note;
  if(S.cuisine && S.cuisine !== "Any"){
    picked.sort((a,b)=>(b.entry.c === S.cuisine) - (a.entry.c === S.cuisine));
  }
  return picked.slice(0, meals).map(m=>buildRecipe(m, ask, people));
}
async function suggestRecipes(){
  S.busy = "recipes"; render();
  const t0 = performance.now();
  await new Promise(r=>setTimeout(r, 420));
  S.recipes = planMeals();
  S.recipeSource = "match";
  logTrace("Pantry match \u00b7 " + S.recipes.length + " of " + RDB.length, "ok", performance.now() - t0);
  S.focus = null; S.busy = null;
  render(); save();
}

/* ------------------------------------------------- substitutions */
function subsFor(name){
  const n = String(name).toLowerCase();
  let table = null;
  Object.keys(SUBS).forEach(k=>{ if(!table && n.indexOf(k) >= 0) table = SUBS[k]; });
  const rows = (table || GENERIC_SUBS).map(([nm, ratio, note])=>({
    name: nm, ratio: ratio, note: note,
    inPantry: availablePantry().some(it=>it.name.toLowerCase().indexOf(nm.toLowerCase().split(" ")[0]) >= 0)
  }));
  return rows.sort((a,b)=>(b.inPantry?1:0) - (a.inPantry?1:0));
}
async function fetchSwaps(recipe, ingredient){
  S.busy = "swap"; S.swap.options = null; render();
  const t0 = performance.now();
  await new Promise(r=>setTimeout(r, 260));
  S.swap.options = subsFor(ingredient);
  logTrace("Substitutes for " + ingredient.split(" ")[0], "ok", performance.now() - t0);
  S.busy = null; render();

/* fuzzy match a recipe ingredient back onto a real pantry row */
function matchItem(name){
  const n = String(name).toLowerCase().trim();
  let best = null, bestScore = 0;
  S.pantry.forEach(it=>{
    const p = it.name.toLowerCase();
    let sc = 0;
    if(p === n) sc = 3;
    else if(p.includes(n) || n.includes(p)) sc = 2;
    else {
      const words = n.split(/\s+/).filter(w=>w.length>3);
      if(words.some(w=>p.includes(w))) sc = 1;
    }
    if(sc > bestScore){ bestScore = sc; best = it; }
  });
  return best;
}

/* =======================================================================
   LAYER 3 — Predictive waste
   Deterministic, on-device, and fully itemised: every point of risk has a
   named reason the user can read and argue with.
   ======================================================================= */
function usageRate(category){
  const uses = S.cooked.filter(c=>c.categories.includes(category)).length;
  const weeks = 6;
  return uses / weeks;                       // cook events per week touching this category
}
function inSuggestedRecipe(item){
  return S.recipes.some(r=>r.uses.some(u=>{
    const m = matchItem(u.name);
    return m && m.id === item.id;
  }));
}
function riskFor(item){
  const f = [];
  const d = daysLeft(item);
  const stable = isStable(item);
  const cat = CAT[item.category] || CAT.other;

  if(d < 0) return {score:100, band:"gone", factors:[{label:"Past its date", delta:100}], expired:true};

  if(!stable){
    const band = d <= 1 ? 50 : d <= 2 ? 42 : d <= 3 ? 34 : d <= 5 ? 22 : d <= 7 ? 12 : 0;
    if(band) f.push({label: d + (d===1?" day":" days") + " of shelf life left", delta: band});
  } else if(ageDays(item) > 40){
    f.push({label:"Shelf-stable but untouched for " + Math.round(ageDays(item)/7) + " weeks", delta:38});
  }

  const people = S.people || 2;
  const excess = item.qty / (cat.portion * people);
  if(excess > 1.2) f.push({label:"More on hand than " + people + " " + (people===1?"person":"people") + " usually cook through", delta: Math.round(Math.min(1,(excess-1)/2)*20)});

  const rate = usageRate(item.category);
  if(!S.cooked.length) f.push({label:"No cooking history yet \u2014 assuming low use", delta:12});
  else if(rate < 0.4) f.push({label:"You rarely cook " + cat.label.toLowerCase() + " (" + round1(rate) + " meals/week)", delta:14});
  else if(rate > 1) f.push({label:"You cook " + cat.label.toLowerCase() + " often", delta:-12});

  if(inSuggestedRecipe(item)) f.push({label:"Already in a suggested recipe", delta:-18});
  const dismissedWith = S.dismissed.filter(t=>t.toLowerCase().includes(item.name.toLowerCase().split(" ")[0])).length;
  if(dismissedWith) f.push({label:"You dismissed " + dismissedWith + " recipe(s) using it", delta:10});

  if(item.opened && !stable) f.push({label:"Opened — spoils faster than the printed date", delta:10});
  if(S.kept[item.id] && Date.now() - S.kept[item.id] < 4*DAY) f.push({label:"You said you'd use it", delta:-30});

  const score = Math.max(0, Math.min(100, f.reduce((a,x)=>a+x.delta, 0)));
  const band = score >= 50 ? "high" : score >= 30 ? "watch" : "fine";
  return {score, band, factors:f, expired:false};
}
function atRisk(){
  return S.pantry
    .map(it=>({item:it, risk:riskFor(it)}))
    .filter(r=>r.risk.band === "high" || r.risk.band === "gone")
    .sort((a,b)=>b.risk.score - a.risk.score);
}
function forecastLbs(){
  const w = {produce:0.5, dairy:0.9, meat:1, bakery:0.7, canned:0.9, dry:1.2, frozen:0.8, condiment:0.7, other:0.5};
  return round1(atRisk().reduce((a,r)=>a + r.item.qty * (w[r.item.category]||0.6), 0));
}

/* The check is rule-based for the prototype: it reads the pantry record and
   the state of the photo it was handed, and reports what it can and cannot
   see. A real build would run this against a vision model. */
async function runInspection(item, base64, mode){
  S.inspect[item.id] = {stage:"reading", img:base64, result:null};
  render();
  const t0 = performance.now();
  await new Promise(r=>setTimeout(r, 950));
  const exp = new Date(item.expiry);
  const dateText = "BEST BY " + String(exp.getMonth()+1).padStart(2,"0") + "/" + exp.getFullYear();
  let res;
  if(mode === "damaged"){
    res = {item:item.name, sealed:false, damage:"Deep dent along the seam, seal lifted",
      labelLegible:false, dateText:null, verdict:"fail", conf:0.88,
      findings:["Body is dented at the seam","Lid no longer sits flush","Best-by text is not readable"], at:Date.now()};
  } else if(mode === "upload"){
    res = {item:item.name, sealed:null, damage:null, labelLegible:false, dateText:null,
      verdict:"review", conf:0.35,
      findings:["Photo received but not analysed in this prototype","Use a demo photo to see a full check"], at:Date.now()};
  } else if(item.opened){
    res = {item:item.name, sealed:false, damage:null, labelLegible:true, dateText:dateText,
      verdict:"fail", conf:0.9, findings:["Packaging is already open","Opened food cannot be donated"], at:Date.now()};
  } else {
    res = {item:item.name, sealed:true, damage:null, labelLegible:true, dateText:dateText,
      verdict:"pass", conf:0.93,
      findings:["Seal and seam look intact","Label is clean and readable","Date matches the pantry record"], at:Date.now()};
  }
  S.inspect[item.id] = {stage:"done", img:base64, result:res};
  item.verified = res;
  item.locked = res.verdict === "pass";
  logTrace("Safety check \u00b7 " + res.verdict, "ok", performance.now() - t0);
  render(); save();
}
function inspectionOK(item){ return !!(item.verified && item.verified.verdict === "pass"); }
function draftReady(){
  const items = S.draft.items.map(id=>S.pantry.find(p=>p.id===id)).filter(Boolean);
  return items.length > 0 && items.every(inspectionOK);
}

/* ---------------------------------------------------------------------
   Minimal QR encoder — byte mode, error correction level M, versions 1-4.
   Enough for a donation reference; renders to SVG.
   --------------------------------------------------------------------- */
const QR_SPEC = {
  1:{size:21, data:16, ecc:10, blocks:[16], align:[]},
  2:{size:25, data:28, ecc:16, blocks:[28], align:[6,18]},
  3:{size:29, data:44, ecc:26, blocks:[44], align:[6,22]},
  4:{size:33, data:64, ecc:18, blocks:[32,32], align:[6,26]}
};
const QR_EXP = new Array(512), QR_LOG = new Array(256);
(function(){
  let x = 1;
  for(let i = 0; i < 255; i++){
    QR_EXP[i] = x; QR_LOG[x] = i;
    x <<= 1; if(x & 0x100) x ^= 0x11D;
  }
  for(let i = 255; i < 512; i++) QR_EXP[i] = QR_EXP[i - 255];
})();
function qrMul(a, b){ return (a === 0 || b === 0) ? 0 : QR_EXP[QR_LOG[a] + QR_LOG[b]]; }
function qrGenPoly(n){
  let poly = [1];
  for(let i = 0; i < n; i++){
    const next = new Array(poly.length + 1).fill(0);
    for(let j = 0; j < poly.length; j++){
      next[j] ^= poly[j];
      next[j + 1] ^= qrMul(poly[j], QR_EXP[i]);
    }
    poly = next;
  }
  return poly;
}
function qrECC(data, n){
  const gen = qrGenPoly(n);
  const res = new Array(n).fill(0);
  for(let i = 0; i < data.length; i++){
    const factor = data[i] ^ res[0];
    res.shift(); res.push(0);
    if(factor !== 0) for(let j = 0; j < n; j++) res[j] ^= qrMul(gen[j + 1], factor);
  }
  return res;
}
function qrMatrix(text){
  const bytes = [];
  for(let i = 0; i < text.length; i++){
    const c = text.charCodeAt(i);
    if(c < 128) bytes.push(c);
    else { bytes.push(63); }                    // ascii only, by design
  }
  let ver = 0;
  for(let v = 1; v <= 4; v++){
    if(bytes.length + 2 <= QR_SPEC[v].data){ ver = v; break; }
  }
  if(!ver) throw new Error("payload too long");
  const spec = QR_SPEC[ver];

  /* ---- bit stream ---- */
  const bits = [];
  const push = (val, len) => { for(let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4);
  push(bytes.length, 8);
  bytes.forEach(b => push(b, 8));
  for(let i = 0; i < 4 && bits.length < spec.data * 8; i++) bits.push(0);
  while(bits.length % 8) bits.push(0);
  const words = [];
  for(let i = 0; i < bits.length; i += 8){
    let v = 0; for(let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    words.push(v);
  }
  const pads = [0xEC, 0x11];
  let pi = 0;
  while(words.length < spec.data) words.push(pads[pi++ % 2]);

  /* ---- blocks + ecc ---- */
  const blocks = [], eccs = [];
  let at = 0;
  spec.blocks.forEach(len => {
    const blk = words.slice(at, at + len); at += len;
    blocks.push(blk);
    eccs.push(qrECC(blk, spec.ecc));
  });
  const stream = [];
  const maxData = Math.max.apply(null, spec.blocks);
  for(let i = 0; i < maxData; i++) blocks.forEach(b => { if(i < b.length) stream.push(b[i]); });
  for(let i = 0; i < spec.ecc; i++) eccs.forEach(e => stream.push(e[i]));

  /* ---- matrix skeleton ---- */
  const n = spec.size;
  const m = [], fixed = [];
  for(let i = 0; i < n; i++){ m.push(new Array(n).fill(0)); fixed.push(new Array(n).fill(false)); }
  const set = (r, c, v) => { if(r >= 0 && c >= 0 && r < n && c < n){ m[r][c] = v; fixed[r][c] = true; } };

  const finder = (r0, c0) => {
    for(let r = -1; r <= 7; r++) for(let c = -1; c <= 7; c++){
      const rr = r0 + r, cc = c0 + c;
      if(rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
      const on = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                 (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                 (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      set(rr, cc, on ? 1 : 0);
    }
  };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

  for(let i = 8; i < n - 8; i++){
    const v = i % 2 === 0 ? 1 : 0;
    set(6, i, v); set(i, 6, v);
  }
  if(spec.align.length){
    const pos = spec.align;
    pos.forEach(r => pos.forEach(c => {
      if((r === 6 && c === 6) || (r === 6 && c === pos[pos.length-1]) || (r === pos[pos.length-1] && c === 6)) return;
      for(let dr = -2; dr <= 2; dr++) for(let dc = -2; dc <= 2; dc++){
        const on = Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
        set(r + dr, c + dc, on ? 1 : 0);
      }
    }));
  }
  set(n - 8, 8, 1);
  for(let i = 0; i < 9; i++){ if(!fixed[8][i]) set(8, i, 0); if(!fixed[i][8]) set(i, 8, 0); }
  for(let i = 0; i < 8; i++){ if(!fixed[8][n-1-i]) set(8, n-1-i, 0); if(!fixed[n-1-i][8]) set(n-1-i, 8, 0); }

  /* ---- data placement ---- */
  const place = (mask) => {
    const g = m.map(r => r.slice());
    let bit = 0, up = true;
    const total = stream.length * 8;
    for(let col = n - 1; col > 0; col -= 2){
      if(col === 6) col--;
      for(let k = 0; k < n; k++){
        const row = up ? n - 1 - k : k;
        for(let s = 0; s < 2; s++){
          const c = col - s;
          if(fixed[row][c]) continue;
          let v = 0;
          if(bit < total) v = (stream[bit >> 3] >> (7 - (bit & 7))) & 1;
          bit++;
          let inv;
          switch(mask){
            case 0: inv = (row + c) % 2 === 0; break;
            case 1: inv = row % 2 === 0; break;
            case 2: inv = c % 3 === 0; break;
            case 3: inv = (row + c) % 3 === 0; break;
            case 4: inv = (Math.floor(row / 2) + Math.floor(c / 3)) % 2 === 0; break;
            case 5: inv = ((row * c) % 2) + ((row * c) % 3) === 0; break;
            case 6: inv = ((((row * c) % 2) + ((row * c) % 3)) % 2) === 0; break;
            default: inv = ((((row + c) % 2) + ((row * c) % 3)) % 2) === 0; break;
          }
          g[row][c] = inv ? v ^ 1 : v;
        }
      }
      up = !up;
    }
    return g;
  };
  const putFormat = (g, mask) => {
    let fmt = (0 << 3) | mask;                 // 00 = level M
    let rem = fmt;
    for(let i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
    const bitsF = ((fmt << 10) | rem) ^ 0x5412;
    const get = i => (bitsF >> i) & 1;
    /* first copy: (row, col) */
    for(let i = 0; i <= 5; i++) g[i][8] = get(i);
    g[7][8] = get(6); g[8][8] = get(7); g[8][7] = get(8);
    for(let i = 9; i <= 14; i++) g[8][14 - i] = get(i);
    /* second copy */
    for(let i = 0; i <= 7; i++) g[8][n - 1 - i] = get(i);
    for(let i = 8; i <= 14; i++) g[n - 15 + i][8] = get(i);
    g[n - 8][8] = 1;
  };
  const penalty = (g) => {
    let p = 0;
    for(let r = 0; r < n; r++){
      let run = 1;
      for(let c = 1; c < n; c++){
        if(g[r][c] === g[r][c-1]) run++;
        else { if(run >= 5) p += 3 + (run - 5); run = 1; }
      }
      if(run >= 5) p += 3 + (run - 5);
    }
    for(let c = 0; c < n; c++){
      let run = 1;
      for(let r = 1; r < n; r++){
        if(g[r][c] === g[r-1][c]) run++;
        else { if(run >= 5) p += 3 + (run - 5); run = 1; }
      }
      if(run >= 5) p += 3 + (run - 5);
    }
    for(let r = 0; r < n - 1; r++) for(let c = 0; c < n - 1; c++){
      const v = g[r][c];
      if(v === g[r][c+1] && v === g[r+1][c] && v === g[r+1][c+1]) p += 3;
    }
    let dark = 0;
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) dark += g[r][c];
    p += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
    return p;
  };
  let best = null, bestP = Infinity;
  for(let mask = 0; mask < 8; mask++){
    const g = place(mask);
    putFormat(g, mask);
    const p = penalty(g);
    if(p < bestP){ bestP = p; best = g; }
  }
  return best;
}
function qrSVG(text, px, quiet){
  const g = qrMatrix(text);
  const n = g.length, q = quiet == null ? 2 : quiet, total = n + q * 2;
  let d = "";
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++){
    if(g[r][c]) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
  }
  return '<svg class="qr" width="' + px + '" height="' + px + '" viewBox="0 0 ' + total + ' ' + total +
    '" shape-rendering="crispEdges" role="img" aria-label="QR code for this donation">' +
    '<rect width="' + total + '" height="' + total + '" fill="#fff"/>' +
    '<path d="' + d + '" fill="#000"/></svg>';
}

/* =======================================================================
   LAYER 4 — Donation routing
   Safety gate first, then a rules engine over each organisation's stated
   acceptance policy. Rejections are shown with their reason, not hidden.
   ======================================================================= */
function donatable(item){
  if(!isStable(item)) return {ok:false, why:"Perishable — food banks can't accept it from a home kitchen"};
  if(item.opened) return {ok:false, why:"Opened packaging"};
  const d = daysLeft(item);
  if(d < 0) return {ok:false, why:"Past the printed date"};
  if(d < 14) return {ok:false, why:"Too close to its date (needs 14+ days)"};
  return {ok:true, why:"Unopened, shelf-stable, " + shelfWord(item) + " left"};
}
function routeDonation(items){
  const cats = [...new Set(items.map(i=>i.category))];
  const units = items.reduce((a,i)=>a + i.qty, 0);
  const matches = [], rejected = [];
  ORGS.forEach(o=>{
    const accepted = cats.filter(c=>o.accepts.includes(c));
    const missing = cats.filter(c=>!o.accepts.includes(c));
    const free = o.capacity.total - o.capacity.used;
    const dist = distanceMi(HOME, o);
    if(missing.length){
      rejected.push({org:o, dist, why:"Doesn't accept " + missing.map(c=>CAT[c].label.toLowerCase()).join(", ")});
      return;
    }
    if(free < units){
      rejected.push({org:o, dist, why:"At capacity — " + free + " of " + o.capacity.total + " units free"});
      return;
    }
    const needHit = o.needs.filter(n=>items.some(i=>
      i.name.toLowerCase().includes(n.split(" ").pop().toLowerCase()) ||
      n.toLowerCase().includes(i.name.toLowerCase().split(" ").pop())
    ));
    let score = 100 - dist*9 + (orgOpen(o)?10:0) + needHit.length*22 + Math.min(12, free/o.capacity.total*12);
    matches.push({org:o, dist, score:Math.round(score), open:orgOpen(o), needHit, free});
  });
  matches.sort((a,b)=>b.score-a.score);
  rejected.sort((a,b)=>a.dist-b.dist);
  return {matches, rejected, cats, units};
}
function sendDonation(){
  const org = ORGS.find(o=>o.id === S.draft.org);
  const items = S.draft.items.map(id=>S.pantry.find(p=>p.id===id)).filter(Boolean);
  if(!org || !items.length) return;
  const don = {
    id:"D-"+Math.random().toString(36).slice(2,7).toUpperCase(),
    orgId: org.id,
    items: items.map(i=>({name:i.name, qty:i.qty, unit:i.unit, category:i.category, expiry:i.expiry})),
    donor: S.userName || "A neighbour",
    area:"Financial District",         // neighbourhood only — never a street address
    dist: distanceMi(HOME, org),
    status:"pending",
    created: Date.now()
  };
  if(S.draft.requestId){
    don.requestId = S.draft.requestId;
    const req = requestFor(S.draft.requestId);
    if(req) req.filled = Math.min(req.qty, req.filled + items.reduce((a,i)=>a+i.qty,0));
  }
  S.donations.unshift(don);
  org.capacity.used += items.reduce((a,i)=>a+i.qty,0);
  S.pantry = S.pantry.filter(p=>!S.draft.items.includes(p.id));
  items.forEach(i=>{ delete S.inspect[i.id]; });
  S.draft = {items:[], checks:[false,false,false], org:null, requestId:null};
  S.view = "donate.sent";
  S.lastDonation = don.id;
  render(); save();
}
function mealsFrom(don){ return Math.round(don.items.reduce((a,i)=>a+i.qty,0) * 1.6); }

const NOTES = {

  "setup":["Account setup","Two steps. The second is appearance and accessibility, asked during setup rather than buried in a settings menu \u2014 and the same controls are reachable from the sign-in screen itself, because someone who needs high contrast to read a page cannot be asked to sign in first. Everything else here is asked only because the app uses it: each of which the app immediately uses: household size scales every recipe, diet filters the planner, the name signs the donation. Nothing is asked that the system does not act on."],
  "org.scan":["Scan, with a fallback","A camera is a single point of failure at a counter: bad light, a cracked lens, a dead battery. The short code under every QR is the manual path, and it is offered on the same screen rather than buried in help."],
  "account":["Account","The data boundary is restated here, in the place people look when they get nervous. Sign out and the tour can be run from scratch \u2014 useful for a demo, and honest for a real user. Help is a permanent tab rather than a floating button: same position on every screen (WCAG 2.2 \u201cConsistent Help\u201d), reachable in the same reading order, and nothing floats over the content. Accessibility settings live here rather than in a separate menu: three themes, three text sizes and a motion switch, all applied immediately so the effect is visible while choosing. Reported problems are listed in the same place, so a person can see that their disagreement was recorded."],
  "home":["Household home","Home reports what the system currently knows — pantry count, items at risk, donations in flight. Every number is derived from live state, so status is never stale (visibility of system status)."],
  "pantry":["Digital pantry","Shelf life is labelled as an estimate and each row opens its own risk breakdown. The user can always overrule the model with <i>I'll use it</i>, which is stored and subtracts 30 risk points for four days."],
  "pantry.add":["Manual entry","Manual entry is a peer of scanning, not a penalty box. It is the graceful-degradation path when the camera or the OCR model is unavailable (Section 2.4)."],
  "scan":["Capture","The scan screen offers three inputs and never blocks on the camera. Nothing reaches the pantry from this screen — capture and commit are deliberately separated."],
  "scan.review":["OCR review","The model's output is staged, editable and confidence-scored before it becomes data. Rows under 0.60 confidence are flagged for attention. The human commits the write, so a misread costs one edit, not a corrupted pantry (AI suggests / human decides, Table 1)."],
  "donate.inspect":["Photo safety check","Every item is photographed and checked before it can be routed. The check is advisory and conservative: it can only clear an item, never override the checklist that follows. A cleared item is locked \u2014 reserved for donation, so it cannot be cooked or used up by accident until it is released."],
  "recipes":["AI recipes","Every card states why it was suggested and which items it consumes. Dismiss sits beside Cook at the same visual weight — the autonomy level only holds if refusing is as cheap as accepting. The planner scores a recipe library against the pantry, weighting whatever is closest to spoiling, then filters by the intake. Because it is rule-based, every suggestion can be traced back to a reason \u2014 the match score is on each card."],
  "recipes.detail":["Recipe method","Method text is fetched only when the user opens a recipe, and marked as generated. Cooking writes back to the pantry, which is the one place the AI's suggestion becomes a real state change — so it takes an explicit tap."],
  "waste":["Predictive waste","The prediction is a scored model with its reasons printed. No single confidence percentage stands alone: the user sees each factor and its weight, which calibrates trust rather than demanding it (Section 2.2)."],
  "donate.requests":["Asked for, not left over","Two different acts sit behind one Donate tab, so the app separates them. Giving surplus is motivated by not wanting food wasted; responding to a posted request is a decision to give. The organisation writes the request and the reason in its own words, and its progress bar is the only pressure applied \u2014 no countdowns, no guilt."],
  "donate.buy":["Buying on request","The app takes no payment and holds no card. It hands over a shopping list and an address, and the person orders from a shop they are already signed into \u2014 which is both simpler to build and far less to be trusted with. The order number is the receipt for the app, and the shop\u2019s own invoice is the receipt for tax. The tax note states the awkward truth: a deduction is worthless unless you itemise, which most households do not. Overstating it would be a dark pattern. Organisations that would rather have cash say so before the person spends, and point them at their own donation page \u2014 the app deliberately has no way to take money."],
  "org.needs":["Requests","Standing needs re-rank an organisation quietly when surplus is offered. A posted request asks outright, in the organisation\u2019s own words, with its own reason. Keeping the two separate keeps the food bank a party to the exchange rather than a destination for it."],
  "donate.select":["Donation eligibility","Ineligible items are shown with the reason instead of being hidden, so the user learns the rule. Perishables can never enter this flow — the safety constraint is enforced in code, not left to the checklist."],
  "donate.confirm":["Safety confirmation","Three separate active checks, and Confirm stays disabled until all three are made. This is the deliberate pause that mitigates automation bias and implements NFR-2 (Table 2)."],
  "donate.route":["Donation routing","Only an approximate area is drawn, and the exact street address is withheld until the donation is sent (NFR-3). Organisations that were ruled out appear with their reason — a rules engine the user can audit."],
  "donate.sent":["Loop closed","The donor sees status changes made by the organisation, and only now sees the full address. Nothing about the household's grocery history crosses the boundary."],
  "org.incoming":["Food bank view","Staff see item, quantity, neighbourhood and distance — never a street address, and never the donor's pantry or purchase history. That boundary is the data-ownership line in Table 2."],
  "org.capacity":["Capacity","Capacity is a routing input, not a display. When free space drops below an incoming donation's size, the rules engine removes this organisation from the donor's matches with an explanation."],
  "org.needs":["Needs list","What staff mark as needed re-ranks the donor's routing screen in real time. The organisation, not the algorithm, defines what counts as a good match."]
};

const TABS = {
  household:[["home","Home","home"],["pantry","Pantry","pantry"],["recipes","Recipes","recipes"],["donate.select","Donate","donate"],["help","Help","help"]],
  org:[["org.incoming","Incoming","incoming"],["org.scan","Scan","scan"],["org.capacity","Capacity","capacity"],["org.needs","Requests","needs"],["help","Help","help"]]
};

function render(){
  const app = $("app");
  const v = S.view;
  let html = (VIEWS[v] || VIEWS.home)();
  const prevScroll = app.scrollTop;
  app.innerHTML = html;
  app.scrollTop = S.keepScroll ? prevScroll : 0;
  S.keepScroll = false;
  applyPrefs(); renderTabs(); renderSys(); renderNote(); renderFlag(); renderHelp(); announce();
  if(S.view !== S.lastView){
    S.lastView = S.view;
    const c = $("app");
    if(c){
      c.classList.remove("screen-in");
      if(S.motion !== false){ void c.offsetWidth; c.classList.add("screen-in"); }
    }
    if(!(S.tour && S.tour.active) && !S.flag && !S.help){
      const main = $("app");
      if(main && document.activeElement !== main && !isTyping()) main.focus({preventScroll:true});
    }
  }
  if(S.tour && S.tour.active) placeTour();
}
function groupOf(view){
  const head = view.split(".")[0];
  if(head === "org") return view;      // staff tabs are distinct screens
  if(head === "scan") return "pantry";
  if(head === "waste") return "home";
  return head;
}
const NO_CHROME = ["auth","auth.email","auth.face","auth.verify","setup"];
function applyPrefs(){
  const root = document.documentElement;
  root.setAttribute("data-theme", S.theme || "light");
  root.setAttribute("data-motion", S.motion === false ? "off" : "on");
  root.setAttribute("data-text", S.legible ? "legible" : "normal");
  const app = $("app");
  if(app) app.style.zoom = String(S.textScale || 1);
  document.querySelectorAll('[data-act="theme"]').forEach(b=>{
    b.className = b.dataset.v === (S.theme || "light") ? "on" : "";
    b.setAttribute("aria-pressed", b.dataset.v === (S.theme || "light") ? "true" : "false");
  });
}
function isTyping(){
  const a = document.activeElement;
  return !!a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
}
/* ---- read the screen aloud ---- */
let speaking = false;
function speakScreen(){
  if(!("speechSynthesis" in window)){ toast("This browser cannot read text aloud.", "err"); return; }
  if(speaking){ window.speechSynthesis.cancel(); speaking = false; toast("Stopped reading.", "ok"); renderHelp(); return; }
  const app = $("app"); if(!app) return;
  const text = (app.innerText || "").replace(/\s+/g, " ").trim().slice(0, 3000);
  if(!text){ toast("Nothing to read on this screen.", "err"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.98; u.pitch = 1;
  u.onend = () => { speaking = false; renderHelp(); };
  u.onerror = () => { speaking = false; renderHelp(); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  speaking = true;
  logTrace("Read aloud \u00b7 " + text.split(" ").length + " words", "ok", 0);
  renderHelp();
}
function announce(){
  const el = $("liveScreen"); if(!el) return;
  const names = {home:"Home", pantry:"Pantry", scan:"Scan groceries", "scan.review":"Review scanned items",
    recipes:"Recipes", "recipes.detail":"Recipe method", waste:"Waste forecast", "donate.select":"Choose what to donate",
    "donate.inspect":"Photograph each item", "donate.confirm":"Confirm the details", "donate.route":"Where it can go",
    "donate.sent":"Your donations", account:"Account", setup:"Account setup", auth:"Sign in",
    "org.incoming":"Incoming donations", "org.scan":"Scan a donation code", "org.capacity":"Capacity", "org.needs":"Needs list"};
  el.textContent = (names[S.view] || S.view) + " screen";
}
function renderTabs(){
  const bar = $("tabbar");
  if(NO_CHROME.indexOf(S.view) >= 0){ bar.style.display = "none"; bar.innerHTML = ""; return; }
  bar.style.display = "flex";
  bar.setAttribute("role", "navigation");
  bar.setAttribute("aria-label", "Sections");
  const list = TABS[S.role];
  const pend = S.donations.filter(d=>d.status==="pending").length;
  $("tabbar").innerHTML = list.map(([v,label,ic])=>{
    if(v === "help"){
      return '<button class="tab" data-act="helpOpen" aria-haspopup="dialog">'+icon("help",21)+label+'<span class="pip"></span></button>';
    }
    const on = groupOf(S.view) === groupOf(v);
    const badge = (S.role==="org" && v==="org.incoming" && pend) ? '<span class="badge">'+pend+'</span>' : "";
    return '<button class="tab'+(on?" on":"")+'"'+(on?' aria-current="page"':'')+' data-act="go" data-v="'+v+'">'+icon(ic,21)+label+'<span class="pip"></span>'+badge+'</button>';
  }).join("");
  document.querySelectorAll("#roleswitch button").forEach(b=>{
    b.className = b.dataset.v === S.role ? "on" : "";
  });
}
function renderSys(){
  const risk = atRisk();
  const pend = S.donations.filter(d=>d.status==="pending").length;
  const claimed = S.donations.filter(d=>d.status!=="pending").length;
  $("sysstate").innerHTML = [
    ["Pantry items", S.pantry.length],
    ["At risk this week", risk.length + " · ~" + forecastLbs() + " lb"],
    ["Meals planned", S.recipes.length + " of " + RDB.length + " in library"],
    ["Meals cooked", S.cooked.length],
    ["Donations pending", pend],
    ["Donations claimed", claimed]
  ].map(([k,val])=>'<div class="kv"><span>'+k+'</span><b>'+esc(String(val))+'</b></div>').join("");
}
function renderNote(){
  const n = NOTES[S.view] || NOTES.home;
  $("designNote").innerHTML = "<b>"+esc(n[0])+"</b>"+n[1];
}
function renderTrace(){
  const el = $("trace"); if(!el) return;
  if(!S.trace.length){ el.innerHTML = '<div class="empty">Nothing has run yet. Scan a receipt or plan some meals.</div>'; return; }
  el.innerHTML = S.trace.map(t=>{
    const cls = t.status==="ok"?"ok":t.status==="failed"?"fail":"run";
    const right = t.status==="running" ? "…" : (t.status==="ok" ? t.ms+"ms" : "failed");
    return '<div><span>'+esc(t.purpose.slice(0,34))+'</span><span class="'+cls+'">'+right+'</span></div>';
  }).join("");
}

/* ---------------------------------------------------------- pantry */
VIEWS.pantry = function(){
  const filt = S.pantryFilter || "all";
  const rows = S.pantry.filter(it=>{
    if(filt==="risk") return riskFor(it).band==="high";
    if(filt==="soon") return daysLeft(it) <= 6;
    if(filt==="donate") return donatable(it).ok;
    return true;
  }).sort((a,b)=>daysLeft(a)-daysLeft(b));
  let h = '<div class="screen-tag"><span>Pantry</span><span>'+S.pantry.length+' items</span></div>';
  h += '<h2 class="h-title">Your pantry</h2><p class="h-sub">Shelf life is an estimate. Tap any item to see how it was worked out.</p>';
  h += '<div class="row-btns" style="margin-bottom:12px">'+
       '<button class="btn primary small" data-act="go" data-v="scan">Scan receipt</button>'+
       '<button class="btn small" data-act="go" data-v="pantry.add">Add manually</button></div>';
  h += '<div class="chip-row">'+[["all","All"],["soon","Use soon"],["risk","At risk"],["donate","Donatable"]]
        .map(([k,l])=>'<button class="chip'+(filt===k?" on":"")+'" data-act="filter" data-v="'+k+'">'+l+'</button>').join("")+'</div>';
  if(!rows.length) return h + '<div class="banner info">Nothing here yet. Scan a receipt to fill the pantry in one step.</div>';
  h += '<div class="box" style="padding:2px 11px">';
  rows.forEach(it=>{
    const fr = freshness(it), r = riskFor(it), open = S.expanded === it.id;
    h += '<div class="list-row" data-act="expand" data-v="'+it.id+'" style="cursor:pointer">'+
      '<div><div class="name">'+esc(it.name)+(it.opened?' <span class="pill plain">opened</span>':'')+(it.locked?' <span class="pill civic">reserved</span>':'')+'</div>'+
      '<div class="flag muted">'+it.qty+' '+esc(it.unit)+' · '+CAT[it.category].label+
      (it.source==="ocr"?' · <span class="ai-chip" style="padding:1px 4px">scanned</span>':'')+'</div></div>'+
      '<div class="right"><div class="flag mono">'+shelfWord(it)+'</div><span class="pill '+fr.cls+'">'+fr.word+'</span></div></div>';
    if(open){
      h += '<div data-tour="risk" style="padding:2px 0 12px">'+
        '<div class="lbl">Waste risk — '+r.score+'/100</div>'+
        '<div class="meter '+(r.band==="high"?"risk":r.band==="watch"?"warn":"")+'"><i style="width:'+r.score+'%"></i></div>'+
        '<div style="margin-top:8px">'+ (r.factors.length ? r.factors.map(f=>
          '<div class="factor"><span>'+esc(f.label)+'</span><span class="d '+(f.delta>0?"up":"down")+'">'+(f.delta>0?"+":"")+f.delta+'</span></div>').join("")
          : '<div class="flag muted">No risk factors — this item is fine where it is.</div>') +'</div>'+
        (it.locked
          ? '<div class="banner info" style="margin-top:10px">Locked for donation \u2014 photographed and cleared '+
            new Date(it.verified.at).toLocaleDateString()+'. It cannot be cooked or used up until you release it.'+
            '<div style="margin-top:8px"><button class="btn small" data-act="release" data-v="'+it.id+'">Release it back</button></div></div>'
          : '<div class="row-btns" style="margin-top:10px">'+
            '<button class="btn small" data-act="keep" data-v="'+it.id+'">I\'ll use it</button>'+
            '<button class="btn small" data-act="opened" data-v="'+it.id+'">'+(it.opened?"Mark unopened":"Mark opened")+'</button>'+
            '<button class="btn small" data-act="remove" data-v="'+it.id+'">Used up</button>'+
          '</div>')+'</div>';
    }
  });
  h += '</div>';
  return h;
};

VIEWS["scan.review"] = function(){
  const rows = S.scan.rows;
  const low = rows.filter(r=>r.conf < 0.6).length;
  let h = '<div class="screen-tag"><span>Scan · review</span><span>'+rows.length+' read</span></div>';
  h += '<h2 class="h-title">Check before adding</h2><p class="h-sub">Nothing is in your pantry yet. Edit anything that looks wrong.</p>';
  h += '<div class="banner '+(low?"warn":"ok")+'">'+(low
        ? low + ' row' + (low===1?"":"s") + ' came back with low confidence. They are marked below.'
        : 'All rows read cleanly. Confidence is the reader\u2019s own, not a guarantee.')+'</div>';
  h += '<div class="stack" style="margin-top:12px">';
  rows.forEach((r,i)=>{
    h += '<div class="box pad ai-block'+(r.keep?"":" ")+'" style="'+(r.keep?"":"opacity:.45")+'">'+
      '<div data-tour="'+(i===0?"review-row":"")+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">'+
        '<span class="ai-chip" title="Reader confidence for this line"><span class="dot"></span>conf '+r.conf.toFixed(2)+'</span>'+
        '<button class="btn small" data-act="rowKeep" data-v="'+i+'">'+(r.keep?"Skip this":"Include")+'</button>'+
      '</div>'+
      '<div class="field" style="margin-bottom:8px"><label>Item</label><input type="text" data-row="'+i+'" data-k="name" value="'+esc(r.name)+'"></div>'+
      '<div class="grid3">'+
        '<div class="field" style="margin:0"><label>Category</label><select data-row="'+i+'" data-k="category">'+
          Object.keys(CAT).map(k=>'<option value="'+k+'"'+(k===r.category?" selected":"")+'>'+CAT[k].label+'</option>').join("")+'</select></div>'+
        '<div class="field" style="margin:0"><label>Qty</label><input type="number" step="0.1" data-row="'+i+'" data-k="qty" value="'+r.qty+'"></div>'+

function swapPanel(r){

    h += '<div class="banner err">'+esc(S.swap.error)+'</div>';

    h += S.swap.options.map((o,i)=>
      '<div class="list-row"><div><div class="name">'+esc(o.name)+' '+(o.inPantry?'<span class="pill fresh">in pantry</span>':'<span class="pill plain">need to buy</span>')+'</div>'+

       '<p class="h-sub">Scored from shelf life, quantity, six weeks of cooking history and what you have dismissed.</p>';

       '<div class="flag">'+risk.length+' item'+(risk.length===1?'':'s')+'. This is an estimate, not a measurement.</div></div>';

        '<div><div style="font-weight:600;font-size:13px">'+esc(item.name)+' ×'+item.qty+'</div>'+
        '<div class="flag muted">'+CAT[item.category].label+' · '+shelfWord(item)+' left</div></div>'+
        '<span class="pill '+(r.score>=60?"expiring":"soon")+'">'+r.score+'/100</span></div>'+
      '<div class="meter risk" style="margin:9px 0"><i style="width:'+r.score+'%"></i></div>'+
      r.factors.map(f=>'<div class="factor"><span>'+esc(f.label)+'</span><span class="d '+(f.delta>0?"up":"down")+'">'+(f.delta>0?"+":"")+f.delta+'</span></div>').join("")+
      '<div class="row-btns" style="margin-top:10px">'+
        '<button class="btn small" data-act="suggestFor" data-v="'+item.id+'">Find a recipe</button>'+

/* --------------------------------------------------------- donation */
VIEWS["donate.select"] = function(){

  h += '<h2 class="h-title">Choose what to give</h2><p class="h-sub">Only unopened shelf-stable food with at least two weeks left can be offered.</p>';

  if(S.donations.length){
    h += '<button class="btn small block" data-act="go" data-v="donate.sent" style="margin-bottom:12px">View my '+S.donations.length+' donation'+(S.donations.length===1?"":"s")+'</button>';
  }
  if(!eligible.length){
    h += '<div class="banner info">Nothing in the pantry currently qualifies. That is the safety rule doing its job, not an error.</div>';
  } else {
    h += '<div class="box" style="padding:2px 11px">';
    eligible.forEach(it=>{
      const on = S.draft.items.includes(it.id);
      h += '<div class="list-row" data-act="pick" data-v="'+it.id+'" style="cursor:pointer">'+
        '<div><div class="name">'+(on?"✓ ":"")+esc(it.name)+'</div><div class="flag muted">'+it.qty+' '+esc(it.unit)+' · '+shelfWord(it)+' left</div></div>'+
        '<span class="pill '+(on?"civic":"plain")+'">'+(on?"selected":"add")+'</span></div>';
    });
    h += '</div>';
    h += '<button class="btn civic block" style="margin-top:12px" data-act="go" data-v="donate.inspect"'+(S.draft.items.length?"":" disabled")+'>Continue with '+S.draft.items.length+' item'+(S.draft.items.length===1?"":"s")+'</button>';
  }
  if(blocked.length){
    h += '<div class="lbl" style="margin-top:14px">Not eligible</div><div class="box" data-tour="ineligible" style="padding:2px 11px">';

      h += '<div class="list-row"><div><div class="name muted">'+esc(it.name)+'</div><div class="flag muted">'+esc(donatable(it).why)+'</div></div></div>';
    });
    h += '</div>';

};

VIEWS["donate.inspect"] = function(){

       '<p class="h-sub">The photo is checked for a broken seal, damage and a readable date. Clearing an item locks it for donation.</p>';

  items.forEach((it, ii)=>{
    const ins = S.inspect[it.id] || {stage:"idle"};
    const res = ins.result;
    h += '<div class="box pad"'+(ii===0?' data-tour="inspect-card"':'')+' style="margin-bottom:10px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div><div style="font-weight:600;font-size:12.5px">'+esc(it.name)+' \u00d7'+it.qty+'</div>'+
      '<div class="flag muted">'+CAT[it.category].label+' \u00b7 '+shelfWord(it)+' left</div></div>'+
      (res ? '<span class="pill '+(res.verdict==="pass"?"fresh":res.verdict==="review"?"soon":"expiring")+'">'+res.verdict+'</span>'
           : '<span class="pill plain">no photo yet</span>')+'</div>';
    if(ins.img) h += '<img class="receipt-preview" style="margin-top:9px;max-height:170px;object-fit:contain;background:var(--surface-2)" src="data:image/jpeg;base64,'+ins.img+'" alt="Photo of '+esc(it.name)+'">';
    if(ins.stage === "reading"){
      h += '<div style="display:flex;gap:11px;align-items:center;padding:12px 0">'+
           '<div class="loader sm" style="margin:0"></div>'+
           '<div><div style="font-size:12.5px;font-weight:600">Checking the packaging</div>'+
           '<div class="flag muted">Seal, damage, and whether the date can be read.</div></div></div>';
    } else if(ins.stage === "failed"){
      h += '<div class="banner err" style="margin-top:9px">Could not run the check. <span class="mono">'+esc(ins.error||"")+'</span></div>'+
           '<button class="btn small block" style="margin-top:8px" data-act="inspectDemo" data-v="'+it.id+'">Try again</button>';
    } else if(res){
      h += '<div class="ai-block" style="margin-top:10px">'+
        '<span class="ai-chip"><span class="dot"></span>packaging check \u00b7 conf '+res.conf.toFixed(2)+'</span>'+
        '<div style="margin-top:7px">'+
          '<div class="factor"><span>Seal intact</span><span class="d">'+(res.sealed===null?"unclear":res.sealed?"yes":"no")+'</span></div>'+
          '<div class="factor"><span>Visible damage</span><span class="d '+(res.damage?"up":"down")+'">'+esc(res.damage||"none seen")+'</span></div>'+
          '<div class="factor"><span>Label readable</span><span class="d">'+(res.labelLegible?"yes":"no")+'</span></div>'+
          '<div class="factor"><span>Date on pack</span><span class="d">'+esc(res.dateText||"not found")+'</span></div>'+
        '</div>'+
        (res.findings.length?'<ul style="margin:8px 0 0;padding-left:16px;font-size:10.5px;line-height:1.6;color:var(--ink-2)">'+res.findings.map(f=>"<li>"+esc(f)+"</li>").join("")+'</ul>':'')+
      '</div>';
      if(res.verdict === "pass"){
        h += '<div class="banner ok" style="margin-top:9px">Cleared and locked for donation.</div>';
      } else if(res.verdict === "review"){
        h += '<div class="banner warn" style="margin-top:9px">The photo was not clear enough to judge. Retake it, or drop this item from the donation.</div>';
      } else {
        h += '<div class="banner err" style="margin-top:9px">This item cannot be donated on what the photo shows. Keep it, or throw it out if the packaging is damaged.</div>';
      }
      h += flagBtn("check", it.id, "the check on " + it.name);
      if(res.verdict !== "pass"){
        h += '<div class="row-btns" style="margin-top:9px">'+
          '<button class="btn small" data-act="inspectDemo" data-v="'+it.id+'">Retake (sealed)</button>'+
          '<button class="btn small" data-act="pick" data-v="'+it.id+'">Drop from donation</button></div>';
      }
    } else {
      h += '<div class="row-btns" style="margin-top:10px">'+
        '<button class="btn primary small" data-act="inspectDemo" data-v="'+it.id+'">Photo: sealed tin</button>'+
        '<button class="btn small" data-act="inspectDamaged" data-v="'+it.id+'">Photo: dented tin</button>'+
      '</div>'+
      '<label class="btn small block" style="margin-top:6px">Take or upload your own<input type="file" id="insp_'+it.id+'" accept="image/*" capture="environment" style="display:none"></label>';
    }
    h += '</div>';
  });
  const ready = draftReady();
