  if(!ready) h += '<div class="flag muted" style="text-align:center">Every item needs a photo that passes before this donation can be routed.</div>';
  h += '<button class="btn link" data-act="go" data-v="donate.select">Change what I am giving</button>';
  return h;
};

function donateModes(active){
  return '<div class="seg" role="group" aria-label="Ways to give" style="display:flex;width:100%;margin-bottom:14px">'+
    '<button style="flex:1" class="'+(active==="pantry"?"on":"")+'" data-act="go" data-v="donate.select" aria-pressed="'+(active==="pantry"?"true":"false")+'">From my pantry</button>'+
    '<button style="flex:1" class="'+(active==="requests"?"on":"")+'" data-act="go" data-v="donate.requests" aria-pressed="'+(active==="requests"?"true":"false")+'">They asked for (' + openRequests().length + ')</button>'+
  '</div>';
}
VIEWS["donate.requests"] = function(){
  const list = S.requests.slice().sort((a,b)=>{
    const rank = {urgent:0, soon:1, ongoing:2};
    return (rank[a.urgency] - rank[b.urgency]) || (b.qty - b.filled) - (a.qty - a.filled);
  });
  let h = '<div class="screen-tag"><span>Donate</span><span>posted by food banks</span></div>';
  h += '<h2 class="h-title">What they have asked for</h2>'+
       '<p class="h-sub">These are posted by the organisations themselves. Nothing here is worked out from your pantry \u2014 it is what they are short of this week.</p>';
  h += donateModes("requests");
  list.forEach(r=>{
    const org = ORGS.find(o=>o.id===r.orgId);
    const pct = Math.min(100, Math.round(r.filled / r.qty * 100));
    const left = Math.max(0, r.qty - r.filled);
    const u = URGENCY[r.urgency];
    const match = S.pantry.find(it=>donatable(it).ok && it.name.toLowerCase().split(" ").some(w=>w.length>3 && r.item.toLowerCase().indexOf(w) >= 0));
    h += '<div class="box pad" style="margin-bottom:11px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<div><div style="font-weight:600;font-size:13.5px">'+esc(r.item)+'</div>'+
        '<div class="flag muted">'+esc(org.name)+' \u00b7 '+distanceMi(HOME, org)+' mi</div></div>'+
        '<span class="pill '+u.cls+'">'+u.label+'</span></div>'+
      '<div class="flag" style="margin:8px 0 6px">\u201c'+esc(r.note)+'\u201d</div>'+
      '<div class="meter '+(pct<40?"risk":pct<80?"warn":"")+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="flag muted mono" style="margin-top:5px">'+r.filled+' of '+r.qty+' '+esc(r.unit)+'s \u00b7 '+left+' still needed</div>'+
      (left === 0 ? '<div class="banner ok" style="margin-top:9px">Fully met. Thank you.</div>' :
        '<div class="row-btns" style="margin-top:10px">'+
          '<button class="btn civic small" data-act="buyOpen" data-v="'+r.id+'">Buy and donate</button>'+
          (match ? '<button class="btn small" data-act="giveFromPantry" data-v="'+r.id+'">I have this already</button>' : '')+
        '</div>')+
      (org.prefers === "funds"
        ? '<div class="flag muted" style="margin-top:8px">'+esc(org.name)+' says it can buy at wholesale and would rather receive funds than goods, so a smaller cash gift may go further here.</div>'
        : '')+
    '</div>';
  });
  h += '<div class="banner info">Why this exists: giving from a shortage list is a different act from clearing out a cupboard. Both are welcome, and the app keeps them separate.</div>';
  return h;
};

VIEWS["donate.buy"] = function(){
  const r = requestFor(S.buy && S.buy.id);
  if(!r){ S.view = "donate.requests"; return VIEWS["donate.requests"](); }
  const org = ORGS.find(o=>o.id===r.orgId);
  const left = Math.max(1, r.qty - r.filled);
  const qty = Math.min(S.buy.qty || 6, left);
  const est = qty * r.price;

  /* ---- step one: how many ---- */
  if(S.buy.stage !== "order"){
    let h = '<div class="screen-tag"><span>Buy and donate</span><span>'+esc(r.id)+'</span></div>';
    h += '<h2 class="h-title">'+esc(r.item)+'</h2>'+
         '<p class="h-sub">You buy it from a shop you already use and have it delivered to '+esc(org.name)+'. The app never takes payment and never handles the goods.</p>';

function mapSVG(matches){
  const pts = matches.map(m=>m.org);
  const lats = pts.map(p=>p.lat).concat([HOME.lat]), lngs = pts.map(p=>p.lng).concat([HOME.lng]);
  const pad = 0.006;
  const minLat = Math.min(...lats)-pad, maxLat = Math.max(...lats)+pad;
  const minLng = Math.min(...lngs)-pad, maxLng = Math.max(...lngs)+pad;
  const X = p => ((p.lng - minLng)/(maxLng-minLng))*320 + 10;
  const Y = p => (1-(p.lat - minLat)/(maxLat-minLat))*140 + 10;
  let g = "";
  for(let i=0;i<=8;i++) g += '<line x1="'+(i*42)+'" y1="0" x2="'+(i*42)+'" y2="160" stroke="#DDE3D6" stroke-width="1"/>';
  for(let i=0;i<=4;i++) g += '<line x1="0" y1="'+(i*40)+'" x2="340" y2="'+(i*40)+'" stroke="#DDE3D6" stroke-width="1"/>';
  const hx = X(HOME), hy = Y(HOME);
  let mk = '<circle cx="'+hx+'" cy="'+hy+'" r="34" fill="#2A4780" fill-opacity=".10" stroke="#2A4780" stroke-opacity=".35" stroke-dasharray="4 3"/>'+
           '<text x="'+hx+'" y="'+(hy+52)+'" font-size="8" fill="#2A4780" text-anchor="middle" font-family="monospace">YOUR AREA</text>';
  matches.slice(0,4).forEach((m,i)=>{
    const x = X(m.org), y = Y(m.org);
    mk += '<circle cx="'+x+'" cy="'+y+'" r="'+(i===0?7:5)+'" fill="'+(i===0?"#1C6B47":"#828C82")+'"/>'+
          '<text x="'+x+'" y="'+(y-10)+'" font-size="8.5" fill="#15211B" text-anchor="middle" font-family="monospace">'+(i+1)+'</text>';
  });
  return '<div class="map"><svg viewBox="0 0 340 160" width="100%" height="160" role="img" aria-label="Approximate area map">'+g+mk+'</svg></div>';
}

  const mine = S.requests.filter(r=>r.orgId === org.id);
  const nr = S.newReq || {};
  let h = '<div class="screen-tag"><span>Requests</span><span>'+esc(org.name)+'</span></div>';
  h += '<h2 class="h-title">Ask for what you need</h2>'+
       '<p class="h-sub">Posted requests appear on every household\u2019s Donate screen. This is how you get what you are short of instead of whatever people have spare.</p>';

  if(!mine.length){
    h += '<div class="banner info">Nothing posted yet. Add a request below and it will show up on the household side straight away.</div>';
  }
  mine.forEach(r=>{
    const pct = Math.min(100, Math.round(r.filled / r.qty * 100));
    const u = URGENCY[r.urgency];
    h += '<div class="box pad" style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<div><div style="font-weight:600;font-size:13px">'+esc(r.item)+'</div>'+
        '<div class="flag muted mono">'+esc(r.id)+' \u00b7 $'+r.price.toFixed(2)+' per '+esc(r.unit)+'</div></div>'+
        '<span class="pill '+u.cls+'">'+u.label+'</span></div>'+
      '<div class="meter '+(pct<40?"risk":pct<80?"warn":"")+'" style="margin:9px 0 5px"><i style="width:'+pct+'%"></i></div>'+
      '<div class="flag muted mono">'+r.filled+' of '+r.qty+' received \u00b7 '+pct+'%</div>'+
      '<div class="flag muted" style="margin-top:6px">\u201c'+esc(r.note)+'\u201d</div>'+
      '<div class="row-btns" style="margin-top:10px">'+
        '<button class="btn small" data-act="reqUrgency" data-v="'+r.id+'">Change urgency</button>'+
        '<button class="btn small" data-act="reqClose" data-v="'+r.id+'">Close request</button>'+
      '</div></div>';
  });

  h += '<div class="lbl" style="margin-top:16px">Post a new request</div>';
  h += '<div class="box pad">'+
    '<div class="field"><label for="nr_item">What do you need?</label>'+
      '<input type="text" id="nr_item" data-k="nrItem" value="'+esc(nr.item||"")+'" placeholder="Tinned tomatoes"></div>'+
    '<div class="grid3">'+
      '<div class="field" style="margin:0"><label for="nr_qty">How many</label><input type="number" id="nr_qty" data-k="nrQty" value="'+(nr.qty||50)+'" min="1"></div>'+
      '<div class="field" style="margin:0"><label for="nr_unit">Unit</label><input type="text" id="nr_unit" data-k="nrUnit" value="'+esc(nr.unit||"tin")+'"></div>'+
      '<div class="field" style="margin:0"><label for="nr_price">Cost each</label><input type="number" id="nr_price" data-k="nrPrice" step="0.05" value="'+(nr.price||1.20)+'"></div>'+
    '</div>'+
    '<div class="field" style="margin-top:10px"><label for="nr_urg">Urgency</label>'+
      '<select id="nr_urg" data-k="nrUrg">'+
        Object.keys(URGENCY).map(k=>'<option value="'+k+'"'+((nr.urgency||"soon")===k?" selected":"")+'>'+URGENCY[k].label+'</option>').join("")+
      '</select></div>'+
    '<div class="field"><label for="nr_note">Why you need it</label>'+
      '<input type="text" id="nr_note" data-k="nrNote" value="'+esc(nr.note||"")+'" placeholder="Weekend family bags, we are 80 short"></div>'+
    '<button class="btn primary block" data-act="reqCreate">Post this request</button>'+
    '<div class="flag muted" style="text-align:center">Households see the reason you type, so say it plainly.</div>'+
  '</div>';

  h += '<div class="lbl" style="margin-top:16px">Standing needs (used for routing)</div>';
  h += '<div class="box" style="padding:2px 11px">'+ NEED_OPTIONS.map(n=>{
    const on = org.needs.indexOf(n) >= 0;
    return '<div class="list-row" data-act="need" data-v="'+esc(n)+'" style="cursor:pointer"><div class="name">'+esc(n)+'</div>'+
           '<span class="pill '+(on?"civic":"plain")+'">'+(on?"needed":"off")+'</span></div>';
  }).join("") + '</div>';
  h += '<div class="banner info" style="margin-top:10px">Standing needs quietly re-rank you when someone donates surplus. A posted request asks outright. Both matter, and they are separate on purpose.</div>';
  return h;
};

/* =======================================================================
   REPORT A PROBLEM
   Any machine-made claim on screen can be disputed in two taps. Reports are
   kept with the thing they refer to, so the disagreement stays attached to
   the output rather than disappearing into a support inbox.
   ======================================================================= */
const FLAG_REASONS = {
  general:["Something looks wrong", "I cannot find what I need", "A control is hard to use", "Text is hard to read", "The app did something unexpected"],
  ocr:    ["Wrong item name", "Wrong quantity or unit", "Item I never bought", "Missed an item", "Wrong shelf life"],
  recipe: ["Ingredients I don't have", "Wrong cuisine", "Ignored my diet", "Unsafe or wrong method", "Just not useful"],
  risk:   ["This is not going to waste", "Wrong expiry date", "Reasons don't make sense", "Score is too high", "Score is too low"],
  check:  ["Packaging is fine", "Packaging is worse than it says", "Wrong item identified", "Date was readable", "Photo was clear"],
  route:  ["They don't accept this", "Wrong opening hours", "Too far away", "Organisation has closed", "Something else"]
};
const FLAG_TITLES = {
  general:"Report a problem",
  ocr:"Report a misread", recipe:"Report a bad suggestion", risk:"Dispute this prediction",
  check:"Disagree with the safety check", route:"Report a routing problem"
};
function renderFlag(){
  const el = $("flagSheet"); if(!el) return;
  if(!S.flag){ el.className = "sheet"; el.innerHTML = ""; return; }
  const f = S.flag, reasons = FLAG_REASONS[f.context] || FLAG_REASONS.recipe;
  let h = '<div class="sheet-dim" data-act="flagClose"></div><div class="sheet-card" role="dialog" aria-modal="true" aria-label="'+esc(FLAG_TITLES[f.context]||"Report a problem")+'">';
  h += '<div class="sheet-grip"></div>';
  h += '<h4>'+esc(FLAG_TITLES[f.context] || "Report a problem")+'</h4>';
  h += '<p class="flag muted" style="margin:0 0 11px">About: '+esc(f.label)+'</p>';
  h += '<div class="lbl">What went wrong?</div><div style="margin-bottom:11px">'+
    reasons.map((r,i)=>'<button class="chip'+(f.reason===r?" on":"")+'" style="margin:0 5px 6px 0" data-act="flagReason" data-v="'+i+'">'+esc(r)+'</button>').join("")+'</div>';
  h += '<div class="field"><label>Anything else? (optional)</label><input type="text" id="flagNote" data-k="flagNote" value="'+esc(f.note||"")+'" placeholder="What did you expect instead?"></div>';
  h += '<div class="row-btns"><button class="btn small" data-act="flagClose">Cancel</button>'+
       '<button class="btn primary small" data-act="flagSend"'+(f.reason?"":" disabled")+'>Send report</button></div>';
  h += '<p class="flag muted" style="margin:10px 0 0">Reports stay on this device and are listed in your account. Nothing about the item is sent anywhere.</p>';
  h += '</div>';
  el.innerHTML = h; el.className = "sheet on";
}

function flagBtn(context, id, label){
  return '<button class="flag-btn" data-act="flagOpen" data-v="'+context+'|'+id+'|'+esc(label).replace(/\|/g,"")+'" aria-label="Report a problem with '+esc(label)+'">'+
    icon("alert",14)+'Report a problem</button>';
}

const TOUR_ACCENT = {green:"var(--green)", amber:"var(--amber)", red:"var(--red)", civic:"var(--civic)", ai:"var(--ai)"};

async function tourGo(i){
  if(i < 0 || i >= TOUR.length){ ACT.tourEnd(); return; }
  S.tour = {active:true, step:i};
  const st = TOUR[i];
  renderTour();
  if(st.enter){ try{ await st.enter(); }catch(e){} }
  if(st.view) S.view = st.view;
  render();
  setTimeout(placeTour, st.wait || 90);
}
function renderTour(){
  const el = $("tour"); if(!el) return;
  if(!S.tour || !S.tour.active){ el.className = "tour"; el.innerHTML = ""; return; }
  const i = S.tour.step, st = TOUR[i], last = i === TOUR.length - 1;
  const accent = TOUR_ACCENT[st.accent] || "var(--green)";
  let h = st.target ? '<div class="tour-spot" id="tourSpot"></div>' : '<div class="tour-dim"></div>';
  if(st.confetti){
    h += '<div class="confetti" aria-hidden="true">' +
      Array.from({length:14}, (_,n)=>'<i style="left:'+(4 + n*7)+'%;animation-delay:'+(n*0.09).toFixed(2)+'s;background:'+
        ["var(--green)","var(--amber)","var(--civic)","var(--ai)","var(--red)"][n%5]+'"></i>').join("") + '</div>';
  }
  h += '<div class="tour-card" id="tourCard" style="--accent:'+accent+'">';
  h += '<div class="tour-bar"><i style="width:'+Math.round(((i+1)/TOUR.length)*100)+'%"></i></div>';
  if(st.hero){
    h += '<div class="tour-hero"><span class="emoji">'+st.emoji+'</span>'+
         '<div><h3>'+esc(st.title)+'</h3><p>'+esc(st.body)+'</p></div></div>';
  } else {
    h += '<div class="tour-top">'+
         '<span class="tour-badge">'+icon(st.icon || "spark", 19)+'</span>'+
         '<div><span class="tour-step">Step '+(i+1)+' of '+TOUR.length+'</span>'+
         '<h4>'+st.emoji+' '+esc(st.title)+'</h4></div></div>';
    h += '<p>'+esc(st.body)+'</p>';
  }
  if(st.chip) h += '<div class="tour-chip">'+esc(st.chip)+'</div>';
  h += '<div class="row-btns" style="margin-top:12px">'+
       (i > 0 ? '<button class="btn small" data-act="tourBack">Back</button>' : '')+
       '<button class="btn primary small" data-act="tourNext">'+esc(st.next || (last ? "Finish" : "Next"))+'</button></div>';
  if(!last) h += '<button class="btn link" style="width:100%" data-act="tourEnd">Skip \u2014 I\u2019ll explore myself</button>';
  h += '</div>';
  el.innerHTML = h;
  el.className = "tour on";
  placeTour();
  const nextBtn = el.querySelector('[data-act="tourNext"]');
  if(nextBtn && !isTyping()) setTimeout(()=>{ try{ nextBtn.focus({preventScroll:true}); }catch(e){} }, 60);
}
function placeTour(){
  if(!S.tour || !S.tour.active) return;
  const st = TOUR[S.tour.step];
  const screen = document.querySelector(".phone-screen");
  const card = $("tourCard"), spot = $("tourSpot");
  if(!screen || !card) return;
  const sr = screen.getBoundingClientRect();
  let anchorBottom = 0, placeTop = false;
  if(st.target && spot){
    const el = document.querySelector('[data-tour="'+st.target+'"]');
    const app = $("app");
    if(el){
      const off = el.offsetTop - 90;
      if(app) app.scrollTop = Math.max(0, off);
      const r = el.getBoundingClientRect();
      spot.style.top    = (r.top - sr.top - 6) + "px";
      spot.style.left   = (r.left - sr.left - 6) + "px";
      spot.style.width  = (r.width + 12) + "px";
      spot.style.height = (Math.min(r.height, 300) + 12) + "px";
      spot.style.display = "block";
      anchorBottom = r.bottom - sr.top;
      placeTop = anchorBottom > sr.height - 250;
    } else {
      spot.style.display = "none";
    }
  }
  if(placeTop){ card.style.top = "14px"; card.style.bottom = "auto"; }
  else if(st.target){ card.style.top = "auto"; card.style.bottom = "16px"; }
  else { card.style.top = "auto"; card.style.bottom = "16px"; }
}

/* =======================================================================
   ACTIONS
   ======================================================================= */
const ACT = {
  go(v){ S.view = v; if(v==="donate.sent") S.lastDonation = S.lastDonation; render(); },
  role(v){
    if(v === "org"){
      const pend = S.donations.find(d=>d.status === "pending");
      if(pend) S.staffOrg = pend.orgId;
    }
    S.role = v;
    S.view = v === "org" ? "org.incoming" : "home";
    S.lastDonation = null;
    render(); save();
  },
  signIn(v){
    if(v === "face"){
      S.authBusy = "face"; S.view = "auth.face"; render();
      setTimeout(()=>{ S.authBusy = "face-ok"; S.biometric = true; render(); }, 1700);
      setTimeout(()=>{ S.auth.method = "face"; S.authStage = 1; S.view = "auth.verify"; render(); }, 2500);
      setTimeout(()=>{ ACT.completeSignIn("face"); }, 3400);
      return;
    }
    if(v === "email"){
      const el = document.getElementById("au_email");
      const val = el ? el.value.trim() : "";
      if(!val || val.indexOf("@") < 0){
        S.authError = "Enter an email address that includes an @ sign.";
        render();
        const f = document.getElementById("au_email"); if(f) f.focus();
        return;
      }
      S.authError = null;
      S.auth.email = val;
    }
    S.auth.method = v; S.authStage = 0; S.view = "auth.verify"; render();
    setTimeout(()=>{ S.authStage = 1; render(); }, 700);
    setTimeout(()=>{ S.authStage = 2; render(); }, 1400);
    setTimeout(()=>ACT.completeSignIn(v), 2100);
  },
  completeSignIn(v){
    S.auth.signedIn = true;
    S.auth.method = S.auth.method || v;
    if(!S.auth.email) S.auth.email = (PROVIDERS[S.auth.method] || {}).email || null;
    S.authBusy = null;
    if(!S.seenTour){ S.setupStep = 0; S.view = "setup"; render(); save(); }
    else { S.view = "home"; render(); save(); toast("Welcome back, " + (S.userName||"").split(" ")[0] + ".", "ok"); }
  },
  theme(v){ S.theme = v; applyPrefs(); save(); },
  textScale(v){ S.textScale = Number(v); applyPrefs(); S.keepScroll = true; render(); save(); },
  motion(){ S.motion = S.motion === false; applyPrefs(); S.keepScroll = true; render(); save(); },
  flagOpen(v){
    const parts = String(v).split("|");
    if(S.help){ S.help = false; renderHelp(); }
    S.flag = {context:parts[0], id:parts[1], label:parts[2] || "this", reason:null, note:""};
    renderFlag(); openLayer("flagSheet");
  },

/* ------------------------------------------------------------ wiring */
function focusables(root){
  return Array.prototype.slice.call(root.querySelectorAll(
    'button:not([disabled]), input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])'
  )).filter(el=>el.offsetParent !== null);
}
function openLayer(id){
  S.returnFocus = document.activeElement;
  setTimeout(()=>{
    const root = document.getElementById(id); if(!root) return;
    const f = focusables(root);
    if(f.length) f[Math.min(1, f.length - 1)].focus();
  }, 40);
}
function closeLayer(){
  const el = S.returnFocus;
  S.returnFocus = null;
  if(el && el.focus) setTimeout(()=>{ try{ el.focus(); }catch(e){} }, 30);
}
document.addEventListener("keydown", e=>{
  const layerId = S.flag ? "flagSheet" : S.help ? "helpSheet" : (S.tour && S.tour.active) ? "tour" : null;
  if(e.key === "Escape"){
    if(S.flag){ ACT.flagClose(); e.preventDefault(); return; }
    if(S.help){ ACT.helpClose(); e.preventDefault(); return; }
    if(S.tour && S.tour.active){ ACT.tourEnd(); e.preventDefault(); return; }
  }
  if(e.key !== "Tab" || !layerId) return;
  const root = document.getElementById(layerId); if(!root) return;
  const f = focusables(root); if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  else if(f.indexOf(document.activeElement) < 0){ e.preventDefault(); first.focus(); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(!fn) return;
  if(t.tagName === "INPUT" && t.type === "checkbox"){ fn(t.dataset.v); return; }
  e.preventDefault();
  fn(t.dataset.v);
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.k === "ask"){ S.ask = el.value; return; }
  if(el.dataset && el.dataset.k === "userName"){ S.userName = el.value; return; }
  if(el.dataset && el.dataset.k === "authEmail"){ S.authEmail = el.value; return; }
  if(el.dataset && el.dataset.k === "flagNote"){ if(S.flag) S.flag.note = el.value; return; }
  if(el.dataset && el.dataset.k === "orderNo"){ if(S.buy) S.buy.orderNo = el.value; return; }
  if(el.dataset && el.dataset.k === "orderAmt"){ if(S.buy) S.buy.amount = el.value; return; }
  if(el.dataset && el.dataset.k && el.dataset.k.indexOf("nr") === 0){
    S.newReq = S.newReq || {};
    const map = {nrItem:"item", nrQty:"qty", nrUnit:"unit", nrPrice:"price", nrNote:"note"};
    const key = map[el.dataset.k];
    if(key) S.newReq[key] = (key === "qty" || key === "price") ? Number(el.value) : el.value;
    return;
  }
  if(el.dataset && el.dataset.k === "adj"){ S.adj = el.value; return; }
  if(el.dataset && el.dataset.row != null){
    const row = S.scan.rows[+el.dataset.row]; if(!row) return;
    const k = el.dataset.k;
    row[k] = (k==="qty"||k==="shelfDays") ? Number(el.value)||0 : el.value;
  }
});
document.addEventListener("change", e=>{
  if(e.target.dataset && e.target.dataset.k === "staffOrg"){
    S.staffOrg = e.target.value; S.scanState = null; S.keepScroll = true; render(); save(); return;
  }
  if(e.target.dataset && e.target.dataset.k === "cuisine"){
    S.cuisine = e.target.value; S.keepScroll = true; render(); save(); return;
  }
  if(e.target.id && e.target.id.indexOf("insp_") === 0 && e.target.files && e.target.files[0]){
    const item = S.pantry.find(p=>p.id === e.target.id.slice(5));
    const f = e.target.files[0];
    if(item){
      const fr2 = new FileReader();
      fr2.onload = () => runInspection(item, fr2.result.split(",")[1], "upload");
      fr2.readAsDataURL(f);
    }
    return;
  }
  if(e.target.id === "fileIn" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const fr = new FileReader();
    fr.onload = () => {
      const b64 = fr.result.split(",")[1];
      S.scan.img = b64;
      runOCR(b64, file.type || "image/jpeg", true);
    };
    fr.readAsDataURL(file);
  }
});
/* -------------------------------------------------------------- init */
(async function(){
  S = seed();
  await load();
  if(!S.trace) S.trace = [];
  if(!S.scan) S.scan = {stage:"idle", rows:[], img:null, error:null};
  if(!S.draft) S.draft = {items:[], checks:[false,false,false], org:null};
  if(!S.inspect) S.inspect = {};
  if(!S.cuisine) S.cuisine = "Any";
  if(!S.heat) S.heat = "Medium";
  if(!S.people) S.people = 2;
  if(!S.meals) S.meals = 3;
  if(S.intakeOpen == null) S.intakeOpen = true;
  if(S.ask == null) S.ask = "";
  S.swap = null;
  if(!S.reports) S.reports = [];
  if(!S.requests || !S.requests.length) S.requests = seedRequests();
  if(!S.receipts) S.receipts = [];
  S.buy = null; S.newReq = null;
  if(S.legible == null) S.legible = false;
  S.help = false;
  if(!S.theme) S.theme = "light";
  if(!S.textScale) S.textScale = 1;
  if(S.motion == null) S.motion = true;
  S.flag = null; S.scanState = null;
  if(!S.staffOrg) S.staffOrg = "o1";
  applyPrefs();
  if(!S.auth) S.auth = {signedIn:false, method:null, email:null};
  if(!S.userName) S.userName = "Jordan Mehta";
  if(!S.auth.signedIn) S.view = "auth";
  render(); renderTrace();
})();
</script>
